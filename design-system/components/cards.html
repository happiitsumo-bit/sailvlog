<!-- @dsCard group="Components" -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cards — sailvlog Design System</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding-bottom: var(--space-4xl); }
  section { margin-bottom: var(--space-2xl); }
</style>
</head>
<body>
  <div class="ds-topbar" style="position:static;">
    <span class="ds-topbar-title">Cards / カード・リスト</span>
    <button class="ds-btn ds-btn--secondary ds-btn--sm" onclick="dsToggleTheme()" id="themeToggleBtn">Auto</button>
  </div>

  <main class="ds-container" style="padding-top: var(--space-lg);">

    <h2 class="ds-text-title3" style="margin-bottom: var(--space-md);">基本カード</h2>
    <div class="ds-grid ds-grid-2">
      <div class="ds-card">
        <div class="ds-card-header">
          <span class="ds-text-headline">今週のサマリー</span>
          <span class="ds-chip ds-chip--neutral">7/14〜7/20</span>
        </div>
        <p class="ds-text-footnote">練習3回・レース1回。平均風速10.4kt。</p>
      </div>
      <div class="ds-card ds-card--interactive">
        <div class="ds-card-header">
          <span class="ds-text-headline">クリック可能カード</span>
        </div>
        <p class="ds-text-footnote">hoverで浮き上がり、押下で軽く沈む。</p>
      </div>
    </div>

    <h2 class="ds-text-title3" style="margin: var(--space-2xl) 0 var(--space-md);">セッションカード（sailvlog固有）</h2>
    <div class="ds-grid ds-grid-2">
      <article class="ds-session-card">
        <div class="ds-session-card-top">
          <span class="ds-session-card-title">江の島 定期練習</span>
          <span class="ds-chip ds-chip--practice">練習</span>
        </div>
        <div class="ds-session-card-meta">
          <span>2026-07-20（日）9:00</span>
          <span class="ds-chip ds-chip--wind">風速12kt SW</span>
        </div>
        <div class="ds-session-card-footer">
          <span class="ds-text-caption1">470級・全6艇</span>
          <button class="ds-btn ds-btn--tertiary ds-btn--sm">リプレイ →</button>
        </div>
      </article>
      <article class="ds-session-card">
        <div class="ds-session-card-top">
          <span class="ds-session-card-title">全日本選手権 第2レース</span>
          <span class="ds-chip ds-chip--race">レース</span>
        </div>
        <div class="ds-session-card-meta">
          <span>2026-07-18（金）13:30</span>
          <span class="ds-chip ds-chip--wind">風速18kt NE</span>
        </div>
        <div class="ds-session-card-footer">
          <span class="ds-text-caption1">470級・全24艇</span>
          <button class="ds-btn ds-btn--tertiary ds-btn--sm">リプレイ →</button>
        </div>
      </article>
    </div>

    <h2 class="ds-text-title3" style="margin: var(--space-2xl) 0 var(--space-md);">グループ化リスト（設定・詳細行）</h2>
    <div class="ds-list">
      <div class="ds-list-row ds-list-row--interactive">
        <span class="ds-text-callout" style="flex:1;">通知設定</span>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--color-label-tertiary);"><path d="m9 18 6-6-6-6"/></svg>
      </div>
      <div class="ds-list-row ds-list-row--interactive">
        <span class="ds-text-callout" style="flex:1;">艇の管理</span>
        <span class="ds-text-caption1 ds-text-secondary">2艇</span>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--color-label-tertiary);"><path d="m9 18 6-6-6-6"/></svg>
      </div>
      <div class="ds-list-row">
        <span class="ds-text-callout" style="flex:1;">単位（風速）</span>
        <span class="ds-text-caption1 ds-text-secondary">kt</span>
      </div>
    </div>
  </main>

<script>
function dsApplyThemeLabel(){
  var t = document.documentElement.getAttribute('data-theme');
  var btn = document.getElementById('themeToggleBtn');
  if(!btn) return;
  btn.textContent = t === 'dark' ? 'Dark' : t === 'light' ? 'Light' : 'Auto';
}
function dsToggleTheme(){
  var root = document.documentElement;
  var t = root.getAttribute('data-theme');
  if (t === 'dark') { root.setAttribute('data-theme','light'); }
  else if (t === 'light') { root.removeAttribute('data-theme'); }
  else { root.setAttribute('data-theme','dark'); }
  dsApplyThemeLabel();
}
dsApplyThemeLabel();
</script>
</body>
</html>
