<!-- @dsCard group="Components" -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Navigation — sailvlog Design System</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding-bottom: var(--space-4xl); }
  .phone-frame {
    max-width: 375px;
    margin: 0 auto;
    border-radius: var(--radius-sheet);
    overflow: hidden;
    border: 0.5px solid var(--color-separator);
    box-shadow: var(--shadow-lg);
    background: var(--color-bg-canvas);
    height: 560px;
    display: flex;
    flex-direction: column;
  }
  .phone-content {
    flex: 1;
    overflow-y: auto;
    padding: var(--space-lg);
    background-image: linear-gradient(var(--color-bg-canvas), var(--color-bg-canvas));
  }
  .desktop-frame {
    border-radius: var(--radius-card);
    overflow: hidden;
    border: 0.5px solid var(--color-separator);
    box-shadow: var(--shadow-md);
  }
  .desktop-content {
    background: var(--color-bg-canvas);
    padding: var(--space-2xl);
    min-height: 120px;
  }
  section { margin-bottom: var(--space-2xl); }
</style>
</head>
<body>
  <div class="ds-topbar" style="position:static;">
    <span class="ds-topbar-title">Navigation / トップバー・タブバー</span>
    <button class="ds-btn ds-btn--secondary ds-btn--sm" onclick="dsToggleTheme()" id="themeToggleBtn">Auto</button>
  </div>

  <main class="ds-container" style="padding-top: var(--space-lg);">

    <h2 class="ds-text-title3" style="margin-bottom: var(--space-md);">モバイル — 下部タブバー</h2>
    <p class="ds-text-footnote" style="margin-bottom: var(--space-md);">半透明+backdrop-filterのマテリアル。背景がスクロールで透けて見える構造にしてある。</p>
    <div class="phone-frame">
      <div class="ds-topbar">
        <span class="ds-topbar-title">セッション一覧</span>
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      </div>
      <div class="phone-content">
        <article class="ds-session-card" style="margin-bottom: var(--space-md);">
          <div class="ds-session-card-top">
            <span class="ds-session-card-title">江の島 定期練習</span>
            <span class="ds-chip ds-chip--practice">練習</span>
          </div>
          <div class="ds-session-card-meta"><span>7/20 9:00</span><span class="ds-chip ds-chip--wind">12kt</span></div>
        </article>
        <article class="ds-session-card">
          <div class="ds-session-card-top">
            <span class="ds-session-card-title">全日本選手権 第2レース</span>
            <span class="ds-chip ds-chip--race">レース</span>
          </div>
          <div class="ds-session-card-meta"><span>7/18 13:30</span><span class="ds-chip ds-chip--wind">18kt</span></div>
        </article>
      </div>
      <nav class="ds-tabbar">
        <button class="ds-tabbar-item is-active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          ホーム
        </button>
        <button class="ds-tabbar-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" x2="21" y1="6" y2="6"/><line x1="8" x2="21" y1="12" y2="12"/><line x1="8" x2="21" y1="18" y2="18"/><line x1="3" x2="3.01" y1="6" y2="6"/><line x1="3" x2="3.01" y1="12" y2="12"/><line x1="3" x2="3.01" y1="18" y2="18"/></svg>
          セッション
        </button>
        <button class="ds-tabbar-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.8 19.6A2 2 0 1 0 14 16H2"/><path d="M17.5 8a2.5 2.5 0 1 1 2 4H2"/><path d="M9.8 4.4A2 2 0 1 1 11 8H2"/></svg>
          風況
        </button>
        <button class="ds-tabbar-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          マイページ
        </button>
      </nav>
    </div>

    <h2 class="ds-text-title3" style="margin: var(--space-3xl) 0 var(--space-md);">PC — シンプルなトップバー</h2>
    <div class="desktop-frame">
      <div class="ds-topbar">
        <div class="ds-row ds-gap-md">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="var(--color-accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22V8"/><path d="M5 12H2a10 10 0 0 0 20 0h-3"/><circle cx="12" cy="5" r="3"/></svg>
          <span class="ds-topbar-title">sailvlog</span>
        </div>
        <div class="ds-row ds-gap-lg">
          <span class="ds-text-callout ds-text-accent">セッション</span>
          <span class="ds-text-callout ds-text-secondary">風況</span>
          <span class="ds-text-callout ds-text-secondary">艇の管理</span>
        </div>
        <button class="ds-btn ds-btn--primary ds-btn--sm">記録を開始</button>
      </div>
      <div class="desktop-content">
        <span class="ds-text-footnote">PC幅ではタブバーの代わりにシンプルな水平ナビを使う。</span>
      </div>
    </div>
  </main>

<script>
function dsApplyThemeLabel(){
  var t = document.documentElement.getAttribute('data-theme');
  var btn = document.getElementById('themeToggleBtn');
  if(!btn) return;
  btn.textContent = t === 'dark' ? 'Dark' : t === 'light' ? 'Light' : 'Auto';
}
function dsToggleTheme(){
  var root = document.documentElement;
  var t = root.getAttribute('data-theme');
  if (t === 'dark') { root.setAttribute('data-theme','light'); }
  else if (t === 'light') { root.removeAttribute('data-theme'); }
  else { root.setAttribute('data-theme','dark'); }
  dsApplyThemeLabel();
}
dsApplyThemeLabel();
</script>
</body>
</html>
