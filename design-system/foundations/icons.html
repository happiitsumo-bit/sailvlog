<!-- @dsCard group="Icons" -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Icons — sailvlog Design System</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding-bottom: var(--space-4xl); }
  .icon-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: var(--space-md);
  }
  .icon-tile {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--space-sm);
    padding: var(--space-lg);
    background: var(--color-bg-elevated);
    border: 0.5px solid var(--color-separator);
    border-radius: var(--radius-card);
  }
  .icon-tile svg { width: 24px; height: 24px; color: var(--color-label-primary); }
  .icon-tile span { font-size: var(--font-size-caption1); color: var(--color-label-secondary); font-family: var(--font-mono); }
</style>
</head>
<body>
  <div class="ds-topbar" style="position:static;">
    <span class="ds-topbar-title">Icons / アイコン</span>
    <button class="ds-btn ds-btn--secondary ds-btn--sm" onclick="dsToggleTheme()" id="themeToggleBtn">Auto</button>
  </div>

  <main class="ds-container" style="padding-top: var(--space-lg);">
    <p class="ds-text-footnote" style="margin-bottom: var(--space-lg);">
      Lucide由来のインラインSVG（外部読み込みなし、CSPセーフ）。stroke=currentColorでテキスト色/アクセント色を継承する。
      サイズは24×24を基準に、タブバーでは24px、ボタン内では16〜20pxで使用する。
    </p>
    <div class="icon-grid">
      <div class="icon-tile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg>
        <span>play</span>
      </div>
      <div class="icon-tile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="14" y="4" width="4" height="16" rx="1"></rect><rect x="6" y="4" width="4" height="16" rx="1"></rect></svg>
        <span>pause</span>
      </div>
      <div class="icon-tile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.8 19.6A2 2 0 1 0 14 16H2"/><path d="M17.5 8a2.5 2.5 0 1 1 2 4H2"/><path d="M9.8 4.4A2 2 0 1 1 11 8H2"/></svg>
        <span>wind</span>
      </div>
      <div class="icon-tile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22V8"/><path d="M5 12H2a10 10 0 0 0 20 0h-3"/><circle cx="12" cy="5" r="3"/></svg>
        <span>anchor</span>
      </div>
      <div class="icon-tile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" x2="4" y1="22" y2="15"/></svg>
        <span>flag</span>
      </div>
      <div class="icon-tile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
        <span>compass</span>
      </div>
      <div class="icon-tile">
        <!-- 気象風の風矢羽（rev.3新規・.ds-chip--windで使用想定）: 主軸+全羽根2本=目安20kt -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="21" x2="12" y2="4"/><path d="M12 4 8 9"/><path d="M12 9 8 14"/><path d="M12 14 9 17.5"/></svg>
        <span>wind-barb</span>
      </div>
      <div class="icon-tile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>home</span>
      </div>
      <div class="icon-tile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" x2="21" y1="6" y2="6"/><line x1="8" x2="21" y1="12" y2="12"/><line x1="8" x2="21" y1="18" y2="18"/><line x1="3" x2="3.01" y1="6" y2="6"/><line x1="3" x2="3.01" y1="12" y2="12"/><line x1="3" x2="3.01" y1="18" y2="18"/></svg>
        <span>list</span>
      </div>
      <div class="icon-tile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>user</span>
      </div>
      <div class="icon-tile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <span>search</span>
      </div>
      <div class="icon-tile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        <span>x</span>
      </div>
      <div class="icon-tile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" x2="12" y1="2" y2="15"/></svg>
        <span>share</span>
      </div>
      <div class="icon-tile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        <span>chevron-right</span>
      </div>
      <div class="icon-tile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        <span>chevron-down</span>
      </div>
    </div>
  </main>

<script>
function dsApplyThemeLabel(){
  var t = document.documentElement.getAttribute('data-theme');
  var btn = document.getElementById('themeToggleBtn');
  if(!btn) return;
  btn.textContent = t === 'dark' ? 'Dark' : t === 'light' ? 'Light' : 'Auto';
}
function dsToggleTheme(){
  var root = document.documentElement;
  var t = root.getAttribute('data-theme');
  if (t === 'dark') { root.setAttribute('data-theme','light'); }
  else if (t === 'light') { root.removeAttribute('data-theme'); }
  else { root.setAttribute('data-theme','dark'); }
  dsApplyThemeLabel();
}
dsApplyThemeLabel();
</script>
</body>
</html>
