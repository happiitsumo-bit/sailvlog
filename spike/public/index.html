<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>SPIKE-01 Canvas replay prototype</title>
<style>
  html, body { margin: 0; padding: 0; background: #0b1220; color: #e6ecf5; font-family: system-ui, sans-serif; }
  #ui { display: flex; gap: 8px; align-items: center; padding: 8px 12px; background: #121c2e; flex-wrap: wrap; }
  #ui button, #ui select { background: #1e2c47; color: #e6ecf5; border: 1px solid #34496f; border-radius: 4px; padding: 4px 10px; cursor: pointer; }
  #ui button.active { background: #3b6fd8; }
  #seek { flex: 1; min-width: 200px; }
  #stats { padding: 4px 12px; font-size: 12px; color: #9fb2cf; white-space: pre; }
  canvas { display: block; background: #06101d; }
  #legend { padding: 4px 12px; font-size: 12px; color: #9fb2cf; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:4px; vertical-align:middle; }
</style>
</head>
<body>
<div id="ui">
  <button id="playPause">再生</button>
  <button data-speed="1" class="speedBtn active">1x</button>
  <button data-speed="4" class="speedBtn">4x</button>
  <button data-speed="8" class="speedBtn">8x</button>
  <label>ノイズ:
    <select id="noiseSel">
      <option value="clean">clean</option>
      <option value="sigma3" selected>sigma3</option>
      <option value="sigma8">sigma8</option>
    </select>
  </label>
  <label><input type="checkbox" id="tailToggle" checked /> 航跡テール</label>
  <input type="range" id="seek" min="0" max="7199" value="0" step="1" />
  <span id="timeLabel">00:00:00</span>
</div>
<div id="legend"></div>
<canvas id="cv" width="1280" height="800"></canvas>
<div id="stats">loading...</div>
<script src="app.js"></script>
</body>
</html>
