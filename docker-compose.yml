services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: sailvlog_db
      POSTGRES_USER: sailvlog_user
      POSTGRES_PASSWORD: sailvlog_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sailvlog_user -d sailvlog_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      target: development
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql://sailvlog_user:sailvlog_pass@db:5432/sailvlog_db
      # M-05修正（2026-07-27, REVIEW-backend-2.md）: 以前はここが公開リポジトリ上の
      # プレースホルダ文字列そのままで、backend起動時のガード(assertJwtSecretConfigured)を
      # 追加したことでこの値では起動を拒否するようになった。ローカルDocker開発専用のダミー値
      # （本番には使わない）に変更する。
      JWT_SECRET: dev-only-jwt-secret-change-me-1234567890abcdef
      JWT_EXPIRES_IN: 7d
      PORT: 8000
      CORS_ORIGIN: http://localhost:3001,http://localhost:3000
      # R-03: 公開ビュー(/p/[slug])のx-forwarded-client-ipヘッダを信頼するための共有シークレット
      # (backend/.env.example参照)。ローカル開発専用のダミー値。frontend側にも同じ値を設定する
      # 必要がある(Codex担当・frontend/直下のdocker-compose設定はこのコミットでは変更していない)。
      INTERNAL_PROXY_SECRET: dev-only-internal-proxy-secret-change-me
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      target: development
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8001
      API_URL: http://backend:8000
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public

volumes:
  postgres_data:
