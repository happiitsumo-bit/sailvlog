<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head><body>
<style>
.c { background:#FBF9F4;border:1px solid rgba(31,30,27,.10);border-radius:8px;padding:1.75rem;position:relative;overflow:hidden;display:flex;flex-direction:column;min-height:240px; }
.c::after { content:"";position:absolute;top:-40%;right:-25%;width:60%;height:180%;background:#C96442;opacity:.08;transform:skewX(-20deg);pointer-events:none; }
.level { font-family:var(--font-mono);font-size:.65rem;color:#C96442;letter-spacing:.15em;text-transform:uppercase;font-weight:700;margin-bottom:.85rem;display:flex;align-items:center;gap:.5rem; }
.level::before { content:"";display:inline-block;width:18px;height:1.5px;background:#C96442; }
.title { font-family:var(--font-display);font-size:1.6rem;font-weight:700;letter-spacing:-.02em;line-height:1.1;color:#1F1E1B;margin-bottom:.5rem; }
.sub { font-size:.9rem;color:var(--bone-mute);line-height:1.55;margin-bottom:1.5rem; }
.stats { display:flex;gap:1.5rem;margin-top:auto;padding-top:1.25rem;border-top:1px solid rgba(31,30,27,.10); }
.sn { font-family:var(--font-display);font-size:1.3rem;font-weight:700;color:#1F1E1B;display:block;line-height:1; }
.sl { color:var(--bone-mute);text-transform:uppercase;letter-spacing:.08em;font-size:.65rem;margin-top:.25rem;display:block;font-family:var(--font-mono); }
</style>
<div class="card flush">
  <div class="c">
    <div class="level">BEGINNER · 470</div>
    <h3 class="title">470 FOUNDATIONS</h3>
    <p class="sub">470級の基礎から大会出場まで。12レッスンで体系的に学ぶ。</p>
    <div class="stats">
      <div><span class="sn">12</span><span class="sl">Lessons</span></div>
      <div><span class="sn">8h</span><span class="sl">Time</span></div>
      <div><span class="sn">342</span><span class="sl">Enrolled</span></div>
    </div>
  </div>
</div></body></html>
