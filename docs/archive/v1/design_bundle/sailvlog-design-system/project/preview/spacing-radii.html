<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head><body>
<div class="card">
  <div class="label">radii · spacing</div>
  <div style="display:flex;gap:14px;align-items:flex-end;">
    <div class="col" style="align-items:center;"><div style="width:60px;height:60px;background:var(--card);border:1px solid var(--border-strong);border-radius:4px;"></div><span class="swatch-hex">xs · 4 px</span></div>
    <div class="col" style="align-items:center;"><div style="width:60px;height:60px;background:var(--card);border:1px solid var(--border-strong);border-radius:8px;"></div><span class="swatch-hex">sm · 8 px</span></div>
    <div class="col" style="align-items:center;"><div style="width:60px;height:60px;background:var(--card);border:1px solid var(--border-strong);border-radius:12px;"></div><span class="swatch-hex">md · 12 px</span></div>
    <div class="col" style="align-items:center;"><div style="width:60px;height:60px;background:var(--card);border:1px solid var(--border-strong);border-radius:20px;"></div><span class="swatch-hex">lg · 20 px</span></div>
    <div class="col" style="align-items:center;"><div style="width:60px;height:60px;background:var(--card);border:1px solid var(--border-strong);border-radius:999px;"></div><span class="swatch-hex">pill</span></div>
  </div>
  <div style="font-family:var(--font-body);font-size:.85rem;color:var(--fg-mute);">8-pt grid · 4 · 8 · 12 · 16 · 24 · 32 · 48 · 64</div>
</div></body></html>
