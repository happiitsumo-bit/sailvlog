<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head><body>
<style>
.c { background:#FBF9F4;border:1px solid rgba(31,30,27,.10);border-radius:8px;padding:1.5rem;position:relative;overflow:hidden; }
.c::before { content:"";position:absolute;top:0;left:0;width:100%;height:2px;background:#C96442; }
.top { display:flex;gap:1rem;margin-bottom:1rem; }
.av { width:52px;height:52px;border-radius:50%;background:#F7F2E6;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:1.15rem;font-weight:700;color:#6B8E5A;border:1px solid rgba(31,30,27,.18); }
.name { font-family:var(--font-display);font-size:1.05rem;font-weight:700;color:#1F1E1B;letter-spacing:-.01em; }
.handle { font-family:var(--font-mono);font-size:.78rem;color:var(--bone-mute);margin-top:.15rem; }
.tags { display:flex;gap:.35rem;flex-wrap:wrap;margin-bottom:.85rem; }
.tag { font-family:var(--font-mono);font-size:.66rem;color:#6B8E5A;border:1px solid rgba(107,142,90,.4);padding:.15rem .45rem;border-radius:2px;text-transform:uppercase;letter-spacing:.08em; }
.specialty { font-size:.85rem;color:#3D3A33;line-height:1.55;margin-bottom:1rem; }
.stats { display:flex;gap:1.25rem;padding-top:.95rem;border-top:1px solid rgba(31,30,27,.10);font-family:var(--font-mono);font-size:.72rem;color:var(--bone-mute); }
.stats strong { font-family:var(--font-display);font-weight:700;color:#1F1E1B;font-size:.95rem;display:block; }
</style>
<div class="card flush">
  <div class="c">
    <div class="top">
      <div class="av">Y</div>
      <div><div class="name">Yuki Tanaka</div><div class="handle">@yuki</div></div>
    </div>
    <div class="tags"><span class="tag">ILCA</span><span class="tag">12 yrs</span></div>
    <div class="specialty">ILCA 6/7。世界選手権出場経験あり。風の読み方とフィジカルが専門。</div>
    <div class="stats">
      <div><strong>41</strong>Articles</div>
      <div><strong>8</strong>Questions</div>
      <div><strong>1,208</strong>Followers</div>
    </div>
  </div>
</div></body></html>
