<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>リプレイ — 江の島 定期練習 / sailvlog（モックアップ）</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');

/* =========================================================
   このモックアップは反省会=プロジェクタ投影を基準に、
   常時ダーク基調（サイトのライト/ダーク設定に非連動）で組む。
   UI-DESIGN.md §0原則1・§4参照。
   ========================================================= */
:root {
  --replay-bg: #0A0F1A;
  --replay-panel: #101827;
  --replay-panel-2: #151F30;
  --replay-border: rgba(255,255,255,0.08);
  --replay-border-strong: rgba(255,255,255,0.16);
  --replay-fg: #EDEFF3;
  --replay-fg-mute: #8A92A6;
  --replay-fg-dim: #5C6478;

  /* sailvlogブランド色相を維持しつつダーク面用に明度を上げた6艇パレット */
  --boat-1: #FF6B54; /* terra系 */
  --boat-2: #4FD1B5; /* sage系 */
  --boat-3: #F2C94C; /* dijon系 */
  --boat-4: #64B5F6; /* サブ: 青系 */
  --boat-5: #C792EA; /* サブ: 紫系 */
  --boat-6: #FF9A8B; /* terraのトーン違い */

  --font-display: 'Source Serif 4', Georgia, serif;
  --font-body: 'Inter', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
  --font-mono: 'IBM Plex Mono', 'SFMono-Regular', monospace;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
}

* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%; background: var(--replay-bg); color: var(--replay-fg);
  font-family: var(--font-body); overflow-x: hidden;
}

.replay-shell {
  display: grid;
  grid-template-rows: auto 1fr auto;
  height: 100vh;
  min-height: 640px;
}

/* ---------- Top bar ---------- */
.topbar {
  display: flex; align-items: center; gap: 1rem;
  padding: 0.75rem 1.25rem;
  border-bottom: 1px solid var(--replay-border);
  background: var(--replay-panel);
}
.back-link {
  color: var(--replay-fg-mute); text-decoration: none; font-size: 0.85rem; font-weight: 500;
  display: inline-flex; align-items: center; gap: 0.35rem; white-space: nowrap;
}
.back-link:hover { color: var(--replay-fg); }
.topbar-title { flex: 1; min-width: 0; }
.topbar-title .name {
  font-family: var(--font-display); font-size: 1.15rem; font-weight: 600; letter-spacing: -0.01em;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.topbar-title .date { font-family: var(--font-mono); font-size: 0.75rem; color: var(--replay-fg-mute); }
.share-btn {
  display: inline-flex; align-items: center; gap: 0.5rem;
  background: transparent; border: 1px solid var(--replay-border-strong); color: var(--replay-fg);
  padding: 0.55rem 1.05rem; border-radius: 10px; font-size: 0.85rem; font-weight: 600;
  cursor: pointer; transition: all 0.15s var(--ease-out); font-family: var(--font-body);
  white-space: nowrap;
}
.share-btn:hover { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.28); }

/* ---------- Main area: canvas + sidebar ---------- */
.main-area {
  display: grid;
  grid-template-columns: 1fr 320px;
  min-height: 0;
}
.canvas-wrap {
  position: relative;
  min-height: 0;
  background:
    radial-gradient(circle at 30% 15%, rgba(79,209,181,0.05), transparent 55%),
    radial-gradient(circle at 80% 85%, rgba(255,107,84,0.05), transparent 55%),
    var(--replay-bg);
}
#raceCanvas { display: block; width: 100%; height: 100%; cursor: crosshair; }

.canvas-overlay-top {
  position: absolute; top: 0; left: 0; right: 0;
  padding: 0.9rem 1.1rem;
  display: flex; justify-content: space-between; align-items: flex-start;
  pointer-events: none;
}
.legend-inline {
  display: flex; flex-wrap: wrap; gap: 0.6rem 1rem;
  font-size: 0.78rem; font-family: var(--font-mono); color: var(--replay-fg-mute);
}
.legend-inline .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 0.35rem; vertical-align: middle; }
.scale-bar-wrap { position: absolute; bottom: 1rem; left: 1.1rem; color: var(--replay-fg-mute); font-family: var(--font-mono); font-size: 0.72rem; }
.scale-bar { width: 90px; height: 2px; background: var(--replay-fg-mute); margin-top: 0.3rem; }

.loading-state, .empty-state-replay {
  position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
  gap: 0.75rem; color: var(--replay-fg-mute); font-size: 0.9rem; text-align: center; padding: 2rem;
}
.spinner {
  width: 28px; height: 28px; border-radius: 50%;
  border: 3px solid rgba(255,255,255,0.15); border-top-color: var(--boat-4);
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Sidebar ---------- */
.sidebar {
  border-left: 1px solid var(--replay-border);
  background: var(--replay-panel);
  display: flex; flex-direction: column; min-height: 0;
  overflow-y: auto;
}
.main-area > * { min-height: 0; }
.panel { padding: 1.1rem 1.15rem; border-bottom: 1px solid var(--replay-border); }
.panel-grow { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.panel-body-flex { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.panel-title {
  font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--replay-fg-mute); margin-bottom: 0.85rem;
}
.panel-hint { font-size: 0.72rem; color: var(--replay-fg-dim); margin-top: 0.6rem; line-height: 1.5; }

.boat-row {
  display: flex; align-items: center; gap: 0.6rem; padding: 0.5rem 0.3rem; border-radius: 8px;
  cursor: pointer; transition: background 0.12s var(--ease-out);
}
.boat-row:hover { background: rgba(255,255,255,0.04); }
.boat-row input[type=checkbox] { accent-color: var(--boat-4); cursor: pointer; }
.boat-swatch { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 0 3px transparent; transition: box-shadow 0.15s var(--ease-out); }
.boat-row.compared .boat-swatch { box-shadow: 0 0 0 3px rgba(255,255,255,0.18); }
.boat-label { font-size: 0.88rem; font-weight: 500; color: var(--replay-fg); }
.boat-row.dimmed .boat-label { color: var(--replay-fg-dim); }

/* Annotations */
.annotation-list { display: flex; flex-direction: column; gap: 0.1rem; max-height: 260px; overflow-y: auto; margin: -0.2rem -0.3rem; }
.annotation-item {
  padding: 0.55rem 0.6rem; border-radius: 8px; cursor: pointer; transition: background 0.12s var(--ease-out);
  border-left: 2px solid transparent;
}
.annotation-item:hover, .annotation-item.active { background: rgba(255,255,255,0.05); border-left-color: var(--boat-1); }
.annotation-time { font-family: var(--font-mono); font-size: 0.72rem; color: var(--boat-1); font-weight: 600; }
.annotation-body { font-size: 0.85rem; color: var(--replay-fg); margin-top: 0.15rem; line-height: 1.4; }
.annotation-author { font-size: 0.72rem; color: var(--replay-fg-dim); margin-top: 0.15rem; }

.add-note-btn {
  width: 100%; margin-top: 0.85rem; padding: 0.6rem; border-radius: 8px;
  background: rgba(255,107,84,0.10); border: 1px solid rgba(255,107,84,0.35); color: var(--boat-1);
  font-size: 0.82rem; font-weight: 600; cursor: pointer; font-family: var(--font-body);
  transition: all 0.15s var(--ease-out);
}
.add-note-btn:hover { background: rgba(255,107,84,0.18); }

.note-compose { margin-top: 0.7rem; display: none; }
.note-compose.open { display: block; }
.note-compose textarea {
  width: 100%; min-height: 64px; resize: vertical; background: var(--replay-panel-2);
  border: 1px solid var(--replay-border-strong); border-radius: 8px; color: var(--replay-fg);
  font-family: var(--font-body); font-size: 0.85rem; padding: 0.6rem; outline: none;
}
.note-compose textarea:focus { border-color: var(--boat-1); }
.note-compose .actions { display: flex; gap: 0.5rem; margin-top: 0.5rem; justify-content: flex-end; }
.note-compose button { font-size: 0.78rem; padding: 0.4rem 0.8rem; border-radius: 6px; cursor: pointer; font-family: var(--font-body); font-weight: 600; }
.note-compose .cancel { background: transparent; border: 1px solid var(--replay-border-strong); color: var(--replay-fg-mute); }
.note-compose .save { background: var(--boat-1); border: 1px solid var(--boat-1); color: #0A0F1A; }

/* ---------- Bottom control bar ---------- */
.control-bar {
  border-top: 1px solid var(--replay-border);
  background: var(--replay-panel);
  padding: 0.9rem 1.25rem 1.05rem;
}
.transport-row { display: flex; align-items: center; gap: 1rem; margin-bottom: 0.7rem; flex-wrap: wrap; }
.play-btn {
  width: 44px; height: 44px; border-radius: 50%; border: none;
  background: var(--boat-1); color: #0A0F1A; font-size: 1.1rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  transition: transform 0.12s var(--ease-out);
}
.play-btn:hover { transform: scale(1.06); }
.speed-group { display: flex; gap: 0.35rem; }
.speed-btn {
  padding: 0.45rem 0.85rem; border-radius: 8px; border: 1px solid var(--replay-border-strong);
  background: transparent; color: var(--replay-fg-mute); font-family: var(--font-mono); font-weight: 700;
  font-size: 0.85rem; cursor: pointer; transition: all 0.15s var(--ease-out);
}
.speed-btn.active { background: var(--boat-4); border-color: var(--boat-4); color: #0A0F1A; }
.speed-btn:not(.active):hover { color: var(--replay-fg); border-color: rgba(255,255,255,0.3); }
.time-readout { font-family: var(--font-mono); font-size: 1.05rem; font-weight: 600; color: var(--replay-fg); margin-left: auto; white-space: nowrap; }
.time-readout .total { color: var(--replay-fg-dim); font-weight: 500; }
.tail-toggle { display: flex; align-items: center; gap: 0.4rem; font-size: 0.8rem; color: var(--replay-fg-mute); white-space: nowrap; }
.tail-toggle input { accent-color: var(--boat-1); cursor: pointer; }

.timeline-row { position: relative; padding: 14px 0 8px; }
.timeline-track {
  position: relative; height: 6px; background: rgba(255,255,255,0.10); border-radius: 3px; cursor: pointer;
}
.timeline-progress {
  position: absolute; top: 0; left: 0; height: 100%; background: var(--boat-1); border-radius: 3px; width: 20%;
}
.timeline-playhead {
  position: absolute; top: 50%; width: 16px; height: 16px; border-radius: 50%;
  background: var(--boat-1); border: 2px solid #0A0F1A; transform: translate(-50%, -50%);
  left: 20%; box-shadow: 0 0 0 3px rgba(255,107,84,0.25); cursor: grab;
}
.annotation-pin {
  position: absolute; top: 50%; width: 10px; height: 10px; transform: translate(-50%, -50%) rotate(45deg);
  background: var(--boat-3); border: 1px solid #0A0F1A; cursor: pointer;
}
.annotation-pin:hover { transform: translate(-50%, -50%) rotate(45deg) scale(1.3); }

.leg-row { display: flex; gap: 0.5rem; margin-top: 0.7rem; overflow-x: auto; padding-bottom: 2px; }
.leg-chip {
  flex-shrink: 0; padding: 0.4rem 0.9rem; border-radius: 999px; border: 1px solid var(--replay-border-strong);
  background: transparent; color: var(--replay-fg-mute); font-size: 0.78rem; font-weight: 600; cursor: pointer;
  transition: all 0.15s var(--ease-out); white-space: nowrap;
}
.leg-chip:hover { color: var(--replay-fg); border-color: rgba(255,255,255,0.32); }
.leg-chip.current { background: rgba(100,181,246,0.14); border-color: var(--boat-4); color: var(--boat-4); }

/* ---------- Toast ---------- */
.toast {
  position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%) translateY(20px);
  background: #1A2333; border: 1px solid var(--replay-border-strong); color: var(--replay-fg);
  padding: 0.75rem 1.2rem; border-radius: 10px; font-size: 0.85rem; display: flex; align-items: center; gap: 0.6rem;
  opacity: 0; pointer-events: none; transition: all 0.25s var(--ease-out); z-index: 50; box-shadow: 0 10px 30px rgba(0,0,0,0.4);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast code { font-family: var(--font-mono); font-size: 0.78rem; color: var(--boat-4); }

/* ---------- Mobile (縦画面) ---------- */
@media (max-width: 820px) {
  /* 縦画面ではvh固定の分割をやめ、ページ全体スクロールに切り替える。
     Canvasは高さ固定(56vh)で「まず再生」を画面上部に確保し、
     コントロール・タイムライン・折りたたみパネルはその下に自然に積む。 */
  html, body { height: auto; }
  .replay-shell { height: auto; min-height: 100vh; }
  .main-area { display: block; }
  .canvas-wrap { height: 56vh; min-height: 320px; }
  .sidebar { border-left: none; border-top: 1px solid var(--replay-border); max-height: none; overflow-y: visible; }
  .panel-grow { flex: none; }
  .panel-body-flex { flex: none; }
  .topbar-title .name { font-size: 1rem; }
  .transport-row { gap: 0.6rem; }
  .time-readout { font-size: 0.9rem; }
  .canvas-overlay-top { flex-direction: column; gap: 0.5rem; }
  .legend-inline { display: none; } /* サイドバーの艇リストと重複するため縦画面では非表示 */
  .panel[data-collapsible] .panel-body { display: none; }
  .panel[data-collapsible].open .panel-body { display: block; }
  .panel[data-collapsible].open .panel-body.panel-body-flex { display: flex; }
  .panel[data-collapsible] .panel-title { cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
  .panel[data-collapsible] .panel-title::after { content: "▾"; color: var(--replay-fg-dim); }
  .panel[data-collapsible].open .panel-title::after { content: "▴"; }
}
</style>
</head>
<body>

<div class="replay-shell">

  <!-- ===== Top bar ===== -->
  <div class="topbar">
    <a class="back-link" href="#">← 一覧へ</a>
    <div class="topbar-title">
      <div class="name">江の島 定期練習</div>
      <div class="date">2026-07-20（月）15:00〜17:03・練習・6艇</div>
    </div>
    <button class="share-btn" id="shareBtn">🔗 URLをコピー</button>
  </div>

  <!-- ===== Main: canvas + sidebar ===== -->
  <div class="main-area">
    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="raceCanvas"></canvas>

      <div class="canvas-overlay-top">
        <div class="legend-inline" id="legendInline"></div>
      </div>

      <div class="scale-bar-wrap">
        500 m
        <div class="scale-bar"></div>
      </div>

      <div class="loading-state" id="loadingState">
        <div class="spinner"></div>
        <div>航跡を読み込み中…</div>
      </div>
      <div class="empty-state-replay" id="emptyStateReplay">
        <div>このセッションには航跡データがありません</div>
        <a class="back-link" href="#" style="color:var(--boat-4)">← 一覧へ戻る</a>
      </div>
    </div>

    <div class="sidebar">
      <div class="panel" data-collapsible id="panelBoats">
        <div class="panel-title" data-toggle>比較する2艇まで</div>
        <div class="panel-body" id="boatList"></div>
        <div class="panel-hint">チェックした艇はCanvas上で強調表示されます（3件目をチェックすると最も古い選択が外れます）。</div>
      </div>

      <div class="panel panel-grow" data-collapsible id="panelNotes">
        <div class="panel-title" data-toggle>反省メモ</div>
        <div class="panel-body panel-body-flex">
          <div class="annotation-list" id="annotationList"></div>
          <button class="add-note-btn" id="addNoteBtn">＋ 今の場面にメモを残す</button>
          <div class="note-compose" id="noteCompose">
            <textarea placeholder="例: なんでここでタックした？" id="noteText"></textarea>
            <div class="actions">
              <button class="cancel" id="noteCancel">キャンセル</button>
              <button class="save" id="noteSave">保存</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== Bottom control bar ===== -->
  <div class="control-bar">
    <div class="transport-row">
      <button class="play-btn" id="playBtn">▶</button>
      <div class="speed-group">
        <button class="speed-btn active" data-speed="1">1x</button>
        <button class="speed-btn" data-speed="4">4x</button>
        <button class="speed-btn" data-speed="8">8x</button>
      </div>
      <label class="tail-toggle"><input type="checkbox" id="tailToggle" checked> 航跡テール</label>
      <div class="time-readout"><span id="curTime">00:14:02</span> <span class="total">/ 02:03:11</span></div>
    </div>

    <div class="timeline-row">
      <div class="timeline-track" id="timelineTrack">
        <div class="timeline-progress" id="timelineProgress"></div>
        <div class="timeline-playhead" id="timelinePlayhead"></div>
        <!-- 注釈ピン・レグ境界線はJSで挿入 -->
      </div>
    </div>

    <div class="leg-row" id="legRow"></div>
  </div>

</div>

<div class="toast" id="toast">📋 URLをコピーしました: <code id="toastUrl">…</code></div>

<script>
(function () {
  "use strict";

  /* ================= データ（モック） ================= */
  const TOTAL_SEC = 7391; // 02:03:11
  const boats = [
    { id: "t1", label: "4423 田中/佐藤", color: getVar("--boat-1") },
    { id: "t2", label: "マネ艇",          color: getVar("--boat-2") },
    { id: "t3", label: "1102 鈴木/高橋", color: getVar("--boat-3") },
    { id: "t4", label: "0091 山本/井上", color: getVar("--boat-4") },
    { id: "t5", label: "2200 中村/木村", color: getVar("--boat-5") },
    { id: "t6", label: "3311 小林/加藤", color: getVar("--boat-6") },
  ];
  const legs = [
    { label: "スタート", t: 0 },
    { label: "上マーク L1", t: 2100 },
    { label: "下マーク L2", t: 4500 },
    { label: "フィニッシュ", t: 7100 },
  ];
  const annotations = [
    { t: 842,  boat: "t1", author: "主将",   body: "なんでここでタック？もう少し伸ばせたのでは" },
    { t: 2260, boat: "t3", author: "田中",   body: "L1回航、良い加速。他艇も見習いたい" },
    { t: 4610, boat: null, author: "コーチ", body: "この局面、風向が右に振れているのを見逃している艇が多い" },
    { t: 6420, boat: "t6", author: "小林",   body: "接舷しかけて避航が遅れた。次回はここを注意" },
  ];

  function getVar(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  /* ================= 航跡パス生成（ジグザグ・スパイク画像を参考にした簡易生成） ================= */
  function seededRandom(seed) {
    let s = seed;
    return function () {
      s = (s * 9301 + 49297) % 233280;
      return s / 233280;
    };
  }

  function buildZigzagPath(seed, originX, originY, legs, dirSign) {
    const rnd = seededRandom(seed);
    const pts = [];
    let x = originX, y = originY;
    const legCount = 6;
    const legLen = 620;
    for (let i = 0; i < legCount; i++) {
      const angle = (dirSign * (i % 2 === 0 ? 1 : -1)) * (0.35 + rnd() * 0.15);
      const steps = 26;
      for (let s = 0; s < steps; s++) {
        x += Math.sin(angle) * (legLen / steps) + (rnd() - 0.5) * 3;
        y += -Math.cos(angle) * (legLen / steps) * 0.7 + (rnd() - 0.5) * 3;
        pts.push({ x, y });
      }
    }
    return pts;
  }

  const boatPaths = {
    t1: buildZigzagPath(11, 620, 760, legs, 1),
    t2: buildZigzagPath(23, 520, 740, legs, 1),
    t3: buildZigzagPath(37, 700, 770, legs, -1),
    t4: buildZigzagPath(51, 800, 750, legs, -1),
    t5: buildZigzagPath(67, 900, 730, legs, 1),
    t6: buildZigzagPath(83, 780, 800, legs, -1),
  };

  /* ================= 状態 ================= */
  let progress = 0.19; // 0..1 = 00:14:02 / 02:03:11 相当
  let playing = false;
  let speed = 1;
  let lastFrameTs = null;
  const comparedBoats = new Set(["t1", "t3"]);

  /* ================= Canvas描画 ================= */
  const canvas = document.getElementById("raceCanvas");
  const ctx = canvas.getContext("2d");
  const wrap = document.getElementById("canvasWrap");

  function resizeCanvas() {
    const rect = wrap.getBoundingClientRect();
    canvas.width = rect.width * devicePixelRatio;
    canvas.height = rect.height * devicePixelRatio;
    canvas.style.width = rect.width + "px";
    canvas.style.height = rect.height + "px";
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  }

  function project(pt, rect) {
    // 元データの座標系(0..1500程度)をCanvas矩形にフィットさせる簡易投影
    const scale = Math.min(rect.width / 1500, rect.height / 900);
    const offX = (rect.width - 1500 * scale) / 2;
    const offY = (rect.height - 900 * scale) / 2 - 40;
    return { x: pt.x * scale + offX, y: pt.y * scale + offY };
  }

  function drawFrame() {
    const rect = wrap.getBoundingClientRect();
    ctx.clearRect(0, 0, rect.width, rect.height);

    const showTail = document.getElementById("tailToggle").checked;

    boats.forEach((boat) => {
      const path = boatPaths[boat.id];
      const isCompared = comparedBoats.has(boat.id);
      const anyCompared = comparedBoats.size > 0;
      const dimmed = anyCompared && !isCompared;

      // 全区間の薄い航跡ライン
      ctx.beginPath();
      ctx.strokeStyle = dimmed ? hexAlpha(boat.color, 0.18) : hexAlpha(boat.color, 0.45);
      ctx.lineWidth = isCompared ? 2 : 1.4;
      path.forEach((pt, i) => {
        const p = project(pt, rect);
        if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
      });
      ctx.stroke();

      // 現在位置
      const idx = Math.min(path.length - 1, Math.floor(progress * (path.length - 1)));
      const curPt = project(path[idx], rect);

      // 直近テール（強調）
      if (showTail) {
        const tailStart = Math.max(0, idx - 40);
        ctx.beginPath();
        ctx.strokeStyle = dimmed ? hexAlpha(boat.color, 0.35) : boat.color;
        ctx.lineWidth = isCompared ? 3.5 : 2.2;
        for (let i = tailStart; i <= idx; i++) {
          const p = project(path[i], rect);
          if (i === tailStart) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
        }
        ctx.stroke();
      }

      // 現在位置ドット
      const r = isCompared ? 8 : 5;
      if (isCompared) {
        ctx.beginPath();
        ctx.arc(curPt.x, curPt.y, r + 5, 0, Math.PI * 2);
        ctx.fillStyle = hexAlpha(boat.color, 0.20);
        ctx.fill();
      }
      ctx.beginPath();
      ctx.arc(curPt.x, curPt.y, r, 0, Math.PI * 2);
      ctx.fillStyle = dimmed ? hexAlpha(boat.color, 0.4) : boat.color;
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = "#0A0F1A";
      ctx.stroke();

      if (isCompared) {
        ctx.font = "600 12px Inter, sans-serif";
        ctx.fillStyle = "#EDEFF3";
        ctx.fillText(boat.label, curPt.x + r + 8, curPt.y + 4);
      }
    });
  }

  function hexAlpha(hex, alpha) {
    const m = hex.replace("#", "");
    const r = parseInt(m.substring(0, 2), 16);
    const g = parseInt(m.substring(2, 4), 16);
    const b = parseInt(m.substring(4, 6), 16);
    return `rgba(${r},${g},${b},${alpha})`;
  }

  /* ================= サイドバー: 艇リスト ================= */
  const boatListEl = document.getElementById("boatList");
  const legendInlineEl = document.getElementById("legendInline");

  function renderBoatList() {
    boatListEl.innerHTML = "";
    legendInlineEl.innerHTML = "";
    boats.forEach((boat) => {
      const compared = comparedBoats.has(boat.id);
      const row = document.createElement("label");
      row.className = "boat-row" + (compared ? " compared" : "") + (comparedBoats.size > 0 && !compared ? " dimmed" : "");
      row.innerHTML = `
        <input type="checkbox" ${compared ? "checked" : ""} data-boat="${boat.id}">
        <span class="boat-swatch" style="background:${boat.color}"></span>
        <span class="boat-label">${boat.label}</span>
      `;
      boatListEl.appendChild(row);

      const legendSpan = document.createElement("span");
      legendSpan.innerHTML = `<span class="dot" style="background:${boat.color}"></span>${boat.label}`;
      legendInlineEl.appendChild(legendSpan);
    });

    boatListEl.querySelectorAll("input[type=checkbox]").forEach((cb) => {
      cb.addEventListener("change", (e) => {
        const id = e.target.dataset.boat;
        if (e.target.checked) {
          comparedBoats.add(id);
          // 最大2艇: 3件目が入ったら最も古い(Setの先頭)を外す
          if (comparedBoats.size > 2) {
            const oldest = comparedBoats.values().next().value;
            comparedBoats.delete(oldest);
          }
        } else {
          comparedBoats.delete(id);
        }
        renderBoatList();
      });
    });
  }

  /* ================= 反省メモ ================= */
  const annotationListEl = document.getElementById("annotationList");
  function fmtTime(sec) {
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = Math.floor(sec % 60);
    return [h, m, s].map((v) => String(v).padStart(2, "0")).join(":");
  }

  function renderAnnotations() {
    annotationListEl.innerHTML = "";
    const curSec = Math.round(progress * TOTAL_SEC);
    annotations.forEach((a) => {
      const boatLabel = a.boat ? boats.find((b) => b.id === a.boat).label : null;
      const item = document.createElement("div");
      const active = Math.abs(a.t - curSec) < 30;
      item.className = "annotation-item" + (active ? " active" : "");
      item.innerHTML = `
        <div class="annotation-time">${fmtTime(a.t)}${boatLabel ? " · " + boatLabel : ""}</div>
        <div class="annotation-body">${a.body}</div>
        <div class="annotation-author">— ${a.author}</div>
      `;
      item.addEventListener("click", () => seekTo(a.t / TOTAL_SEC));
      annotationListEl.appendChild(item);
    });
  }

  /* ================= タイムライン ================= */
  const timelineTrack = document.getElementById("timelineTrack");
  const timelineProgress = document.getElementById("timelineProgress");
  const timelinePlayhead = document.getElementById("timelinePlayhead");

  function renderTimelineMarkers() {
    // 注釈ピン
    annotations.forEach((a) => {
      const pin = document.createElement("div");
      pin.className = "annotation-pin";
      pin.style.left = (a.t / TOTAL_SEC * 100) + "%";
      pin.title = fmtTime(a.t) + " — " + a.body;
      pin.addEventListener("click", (e) => { e.stopPropagation(); seekTo(a.t / TOTAL_SEC); });
      timelineTrack.appendChild(pin);
    });
  }

  function renderLegChips() {
    const legRow = document.getElementById("legRow");
    legRow.innerHTML = "";
    const curSec = progress * TOTAL_SEC;
    legs.forEach((leg, i) => {
      const nextT = legs[i + 1] ? legs[i + 1].t : TOTAL_SEC;
      const isCurrent = curSec >= leg.t && curSec < nextT;
      const chip = document.createElement("button");
      chip.className = "leg-chip" + (isCurrent ? " current" : "");
      chip.textContent = leg.label;
      chip.addEventListener("click", () => seekTo(leg.t / TOTAL_SEC));
      legRow.appendChild(chip);
    });
  }

  function updateTimelineUI() {
    timelineProgress.style.width = (progress * 100) + "%";
    timelinePlayhead.style.left = (progress * 100) + "%";
    document.getElementById("curTime").textContent = fmtTime(progress * TOTAL_SEC);
    renderLegChips();
    renderAnnotations();
  }

  function seekTo(p) {
    progress = Math.max(0, Math.min(1, p));
    updateTimelineUI();
    drawFrame();
  }

  let draggingTimeline = false;
  timelineTrack.addEventListener("pointerdown", (e) => {
    draggingTimeline = true;
    handleTimelineDrag(e);
  });
  window.addEventListener("pointermove", (e) => { if (draggingTimeline) handleTimelineDrag(e); });
  window.addEventListener("pointerup", () => { draggingTimeline = false; });
  function handleTimelineDrag(e) {
    const rect = timelineTrack.getBoundingClientRect();
    const p = (e.clientX - rect.left) / rect.width;
    seekTo(p);
  }

  /* ================= 再生コントロール ================= */
  const playBtn = document.getElementById("playBtn");
  playBtn.addEventListener("click", () => {
    playing = !playing;
    playBtn.textContent = playing ? "❚❚" : "▶";
    lastFrameTs = null;
    if (playing) requestAnimationFrame(tick);
  });

  document.querySelectorAll(".speed-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".speed-btn").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      speed = parseFloat(btn.dataset.speed);
    });
  });

  document.getElementById("tailToggle").addEventListener("change", drawFrame);

  function tick(ts) {
    if (!playing) return;
    if (lastFrameTs == null) lastFrameTs = ts;
    const dtSec = (ts - lastFrameTs) / 1000;
    lastFrameTs = ts;
    progress += (dtSec * speed) / TOTAL_SEC;
    if (progress >= 1) {
      progress = 1;
      playing = false;
      playBtn.textContent = "▶";
    }
    updateTimelineUI();
    drawFrame();
    if (playing) requestAnimationFrame(tick);
  }

  /* ================= メモ追加 ================= */
  const addNoteBtn = document.getElementById("addNoteBtn");
  const noteCompose = document.getElementById("noteCompose");
  addNoteBtn.addEventListener("click", () => {
    noteCompose.classList.toggle("open");
  });
  document.getElementById("noteCancel").addEventListener("click", () => {
    noteCompose.classList.remove("open");
    document.getElementById("noteText").value = "";
  });
  document.getElementById("noteSave").addEventListener("click", () => {
    const text = document.getElementById("noteText").value.trim();
    if (!text) return;
    annotations.push({ t: Math.round(progress * TOTAL_SEC), boat: null, author: "あなた", body: text });
    annotations.sort((a, b) => a.t - b.t);
    document.getElementById("noteText").value = "";
    noteCompose.classList.remove("open");
    // 新しいピンを反映
    document.querySelectorAll(".annotation-pin").forEach((el) => el.remove());
    renderTimelineMarkers();
    renderAnnotations();
  });

  /* ================= 共有URL（トースト） ================= */
  const shareBtn = document.getElementById("shareBtn");
  const toast = document.getElementById("toast");
  shareBtn.addEventListener("click", () => {
    const curSec = Math.round(progress * TOTAL_SEC);
    const boatsParam = Array.from(comparedBoats).join(",");
    const legIndex = legs.reduce((acc, leg, i) => (curSec >= leg.t ? i : acc), 0);
    const url = `https://sailvlog.example/sessions/1?t=${curSec}&boats=${boatsParam}&leg=${legIndex}`;
    document.getElementById("toastUrl").textContent = url;
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 2600);
  });

  /* ================= モバイル: アコーディオン ================= */
  document.querySelectorAll("[data-collapsible] [data-toggle]").forEach((title) => {
    title.addEventListener("click", () => {
      title.closest("[data-collapsible]").classList.toggle("open");
    });
  });

  /* ================= 初期化 ================= */
  function init() {
    resizeCanvas();
    renderBoatList();
    renderTimelineMarkers();
    updateTimelineUI();
    drawFrame();
  }
  window.addEventListener("resize", () => { resizeCanvas(); drawFrame(); });
  init();
})();
</script>

</body>
</html>
