<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>セッションを登録 — sailvlog（モックアップ・新DS）</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  トークンの正本は design-system/styles.css。手編集せずDS側を直して再生成すること。
  このファイルは styles.css の内容をそのままインライン埋め込みした自己完結HTML（外部参照・CDNなし）。
  GPX取込ウィザード（新規）: 複数ファイル選択→プレビュー（静止Canvas重ね描き）→艇ラベル入力→保存 の3ステップ構成。
  UI-DESIGN.md §3準拠。ライト/ダーク両テーマに対応。
-->
<style>
/* ============================================================
   design-system/styles.css をそのまま埋め込み（唯一の正本）
   ============================================================ */
/* ==========================================================================
   sailvlog Design System — styles.css
   単一ソースのスタイルシート。全プレビューはこれをlinkする。
   方向性: 土台はiOS/インスタ的な使いやすさを維持しつつ、視覚言語は「海図」「水面と光」の2本柱でセーリング文脈に固有化（rev.3）
   ========================================================================== */

/* --------------------------------------------------------------------------
   0. Reset（最小限）
   -------------------------------------------------------------------------- */
*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
}

img,
svg {
  display: block;
  max-width: 100%;
}

button {
  font: inherit;
  color: inherit;
}

input,
textarea,
select {
  font: inherit;
  color: inherit;
}

a {
  color: inherit;
}

ul,
ol {
  margin: 0;
  padding: 0;
  list-style: none;
}

/* --------------------------------------------------------------------------
   1. Design Tokens — Light（デフォルト / :root）
   -------------------------------------------------------------------------- */
:root {
  color-scheme: light;

  /* --- Typography --- */
  --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Sans",
    "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Segoe UI", Roboto, sans-serif;
  --font-mono: ui-monospace, "SF Mono", "Menlo", "Consolas", monospace;

  --font-weight-regular: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;

  /* iOS的タイプスケール（size / line-height） */
  --font-size-large-title: 34px;
  --line-height-large-title: 41px;
  --font-size-title1: 28px;
  --line-height-title1: 34px;
  --font-size-title2: 22px;
  --line-height-title2: 28px;
  --font-size-title3: 20px;
  --line-height-title3: 25px;
  --font-size-headline: 17px;
  --line-height-headline: 22px;
  --font-size-body: 17px;
  --line-height-body: 23px;
  --font-size-callout: 16px;
  --line-height-callout: 21px;
  --font-size-subheadline: 15px;
  --line-height-subheadline: 20px;
  --font-size-footnote: 13px;
  --line-height-footnote: 18px;
  --font-size-caption1: 12px;
  --line-height-caption1: 16px;
  --font-size-caption2: 11px;
  --line-height-caption2: 13px;

  /* --- Spacing（8ptベースグリッド） --- */
  --space-2xs: 2px;
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-lg: 16px;
  --space-xl: 20px;
  --space-2xl: 24px;
  --space-3xl: 32px;
  --space-4xl: 40px;
  --space-5xl: 48px;
  --space-6xl: 64px;

  /* --- Radius --- */
  --radius-sm: 8px;
  --radius-input: 10px;
  --radius-button: 12px;
  --radius-card: 16px;
  --radius-sheet: 20px;
  --radius-pill: 999px;

  /* --- Color: Neutral ramp（iOS systemGray的階調, ライト） --- */
  --color-gray-050: #f7f7f8;
  --color-gray-100: #eeeef0;
  --color-gray-200: #e2e2e6;
  --color-gray-300: #d0d0d6;
  --color-gray-400: #b6b6bf;
  --color-gray-500: #97979f;
  --color-gray-600: #77777f;
  --color-gray-700: #58585f;
  --color-gray-800: #3a3a3f;
  --color-gray-900: #1c1c1f;

  /* --- Color: Semantic surfaces --- */
  --color-bg-canvas: #f2f2f5;         /* systemGroupedBackground相当 */
  --color-bg-primary: #ffffff;        /* systemBackground */
  --color-bg-secondary: #f7f7f8;      /* secondarySystemBackground */
  --color-bg-elevated: #ffffff;       /* カード・シート */
  --color-fill: rgba(120, 120, 128, 0.12);       /* systemFill: コントロール塗り */
  --color-fill-secondary: rgba(120, 120, 128, 0.08);
  --color-fill-strong: rgba(120, 120, 128, 0.20);

  /* --- Color: Label（テキスト） --- */
  --color-label-primary: #1c1c1f;
  --color-label-secondary: rgba(28, 28, 31, 0.6);
  --color-label-tertiary: rgba(28, 28, 31, 0.38);
  --color-label-quaternary: rgba(28, 28, 31, 0.22);
  --color-label-on-accent: #ffffff;

  /* --- Color: Separator（ヘアライン） --- */
  --color-separator: rgba(60, 60, 67, 0.29);
  --color-separator-opaque: #dcdce1;

  /* --- Color: Marine Blue Accent（セーリング文脈） --- */
  --color-accent: #0b6a9e;
  --color-accent-hover: #095778;
  --color-accent-pressed: #074562;
  --color-accent-tint: rgba(11, 106, 158, 0.12);
  --color-accent-tint-strong: rgba(11, 106, 158, 0.22);

  /* --- Color: Semantic status --- */
  --color-success: #1fa363;
  --color-success-tint: rgba(31, 163, 99, 0.12);
  --color-warning: #d98a12;
  --color-warning-tint: rgba(217, 138, 18, 0.14);
  --color-danger: #e0392f;
  --color-danger-tint: rgba(224, 57, 47, 0.12);
  --color-info: #0b6a9e;
  --color-info-tint: rgba(11, 106, 158, 0.12);

  /* --- Color: sailvlog固有（セッション種別・艇識別） --- */
  --color-race: #e0392f;
  --color-race-tint: rgba(224, 57, 47, 0.12);
  --color-practice: #0b6a9e;
  --color-practice-tint: rgba(11, 106, 158, 0.12);
  --color-wind-chip-bg: rgba(11, 106, 158, 0.10);
  --color-wind-chip-fg: #0b6a9e;

  --color-boat-1: #0b6a9e; /* 自艇 */
  --color-boat-2: #e0392f; /* 相手艇 */
  --color-boat-3: #d98a12;
  --color-boat-4: #1fa363;

  /* --- Color: Nautical Chart（海図の視覚言語。等深線・グリッド用の低彩度トーン） --- */
  --color-chart-grid: rgba(11, 106, 158, 0.10);
  --color-chart-line: rgba(28, 28, 31, 0.12);
  --color-compass-ink: rgba(28, 28, 31, 0.16);

  /* --- Shadow（iOSの多層・柔らかい浮遊感） --- */
  --shadow-xs: 0 1px 2px rgba(28, 28, 31, 0.06);
  --shadow-sm: 0 1px 2px rgba(28, 28, 31, 0.05), 0 2px 8px rgba(28, 28, 31, 0.06);
  --shadow-md: 0 2px 6px rgba(28, 28, 31, 0.06), 0 8px 24px rgba(28, 28, 31, 0.08);
  --shadow-lg: 0 4px 12px rgba(28, 28, 31, 0.08), 0 16px 40px rgba(28, 28, 31, 0.12);
  --shadow-float: 0 8px 20px rgba(28, 28, 31, 0.10), 0 2px 6px rgba(28, 28, 31, 0.08);

  /* --- Material（半透明+backdrop-filter, iOS的） --- */
  --material-bg: rgba(255, 255, 255, 0.72);
  --material-blur: 20px;
  --material-border: rgba(60, 60, 67, 0.18);

  /* --- Motion --- */
  --ease-standard: cubic-bezier(0.25, 0.1, 0.25, 1);
  --ease-emphasized: cubic-bezier(0.2, 0.9, 0.3, 1);
  --duration-fast: 120ms;
  --duration-base: 200ms;
  --duration-slow: 320ms;

  /* --- Water & Light（ヒーロー帯・リプレイ海面専用。海はテーマに関わらず常に「深い」ため
       ライト/ダークで再定義せず :root で固定する。夜明けのレガッタ=dawn／深夜の海=deep） --- */
  --gradient-water-dawn: linear-gradient(160deg, #0c2436 0%, #0c5678 42%, #1c7f96 68%, #e3924f 100%);
  --gradient-water-deep: linear-gradient(165deg, #030d16 0%, #0a2f42 40%, #0b5372 72%, #12809e 100%);
  --color-chart-grid-on-water: rgba(255, 255, 255, 0.10);
  --color-chart-line-on-water: rgba(255, 255, 255, 0.16);
  --color-hero-label-primary: rgba(255, 255, 255, 0.96);
  --color-hero-label-secondary: rgba(255, 255, 255, 0.74);

  background: var(--color-bg-canvas);
  color: var(--color-label-primary);
  font-family: var(--font-sans);
}

/* --------------------------------------------------------------------------
   2. Design Tokens — Dark
   iOSダークモード同様、単純反転ではなく面ごとの階調を持たせる。
   -------------------------------------------------------------------------- */
@media (prefers-color-scheme: dark) {

    --color-fill: rgba(120, 120, 128, 0.24);

    --color-label-primary: #f2f2f7;
    --color-label-secondary: rgba(242, 242, 247, 0.6);
    --color-label-tertiary: rgba(242, 242, 247, 0.38);
    --color-label-quaternary: rgba(242, 242, 247, 0.22);
    --color-label-on-accent: #ffffff;

    --color-separator: rgba(84, 84, 88, 0.6);
    --color-separator-opaque: #3a3a3c;

    --color-accent: #2f9fd1;
    --color-accent-hover: #49b0dd;
    --color-accent-pressed: #63bce6;
    --color-accent-tint: rgba(47, 159, 209, 0.16);
    --color-accent-tint-strong: rgba(47, 159, 209, 0.28);

    --color-success: #34c07a;
    --color-success-tint: rgba(52, 192, 122, 0.16);
    --color-warning: #f0a72e;
    --color-warning-tint: rgba(240, 167, 46, 0.18);
    --color-danger: #ff5b52;
    --color-danger-tint: rgba(255, 91, 82, 0.16);
    --color-info: #2f9fd1;

    --color-race: #ff5b52;

    --color-wind-chip-fg: #63bce6;

    --color-boat-1: #2f9fd1;
    --color-boat-2: #ff5b52;
    --color-boat-3: #f0a72e;
    --color-boat-4: #34c07a;

    --color-chart-grid: rgba(47, 159, 209, 0.16);
    --color-chart-line: rgba(242, 242, 247, 0.10);
    --color-compass-ink: rgba(242, 242, 247, 0.14);

    --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.4);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.36), 0 2px 10px rgba(0, 0, 0, 0.4);
    --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.4), 0 10px 28px rgba(0, 0, 0, 0.46);
    --shadow-lg: 0 6px 16px rgba(0, 0, 0, 0.44), 0 20px 48px rgba(0, 0, 0, 0.5);
    --shadow-float: 0 10px 24px rgba(0, 0, 0, 0.5), 0 2px 8px rgba(0, 0, 0, 0.4);

    --material-bg: rgba(28, 28, 30, 0.72);
    --material-blur: 20px;
    --material-border: rgba(84, 84, 88, 0.5);

    background: var(--color-bg-canvas);
    color: var(--color-label-primary);
  }
}

   これにより「常時ダーク」を意図するsailvlog固有のブロック（リプレイ画面等）を
   ページ全体のテーマに関係なく部分的にダーク固定できる（CSS変数はスコープ内に継承される）。 */

/* --------------------------------------------------------------------------
   3. Typography utility classes
   -------------------------------------------------------------------------- */
.ds-text-large-title {
  font-size: var(--font-size-large-title);
  line-height: var(--line-height-large-title);
  font-weight: var(--font-weight-bold);
  letter-spacing: -0.02em;
}
.ds-text-title1 {
  font-size: var(--font-size-title1);
  line-height: var(--line-height-title1);
  font-weight: var(--font-weight-bold);
  letter-spacing: -0.015em;
}
.ds-text-title2 {
  font-size: var(--font-size-title2);
  line-height: var(--line-height-title2);
  font-weight: var(--font-weight-bold);
  letter-spacing: -0.01em;
}
.ds-text-title3 {
  font-size: var(--font-size-title3);
  line-height: var(--line-height-title3);
  font-weight: var(--font-weight-semibold);
}
.ds-text-headline {
  font-size: var(--font-size-headline);
  line-height: var(--line-height-headline);
  font-weight: var(--font-weight-semibold);
}
.ds-text-body {
  font-size: var(--font-size-body);
  line-height: var(--line-height-body);
  font-weight: var(--font-weight-regular);
}
.ds-text-callout {
  font-size: var(--font-size-callout);
  line-height: var(--line-height-callout);
}
.ds-text-subheadline {

  line-height: var(--line-height-subheadline);
}
.ds-text-footnote {
  font-size: var(--font-size-footnote);
  line-height: var(--line-height-footnote);
  color: var(--color-label-secondary);
}
.ds-text-caption1 {
  font-size: var(--font-size-caption1);
  line-height: var(--line-height-caption1);
  color: var(--color-label-secondary);
}
.ds-text-caption2 {
  font-size: var(--font-size-caption2);
  line-height: var(--line-height-caption2);
  color: var(--color-label-tertiary);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.ds-text-secondary {
  color: var(--color-label-secondary);
}
.ds-text-tertiary {
  color: var(--color-label-tertiary);
}
.ds-text-accent {
  color: var(--color-accent);
}
.ds-text-mono {
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
}

/* --------------------------------------------------------------------------
   4. Layout utilities
   -------------------------------------------------------------------------- */
.ds-container {
  max-width: 960px;
  margin-inline: auto;
  padding-inline: var(--space-lg);
}

.ds-stack {
  display: flex;
  flex-direction: column;
}
.ds-row {
  display: flex;
  flex-direction: row;
  align-items: center;
}
.ds-gap-xs { gap: var(--space-xs); }
.ds-gap-sm { gap: var(--space-sm); }
.ds-gap-md { gap: var(--space-md); }
.ds-gap-lg { gap: var(--space-lg); }
.ds-gap-xl { gap: var(--space-xl); }

.ds-grid {
  display: grid;
  gap: var(--space-lg);
}
.ds-grid-2 { grid-template-columns: repeat(2, 1fr); }
.ds-grid-3 { grid-template-columns: repeat(3, 1fr); }
.ds-grid-4 { grid-template-columns: repeat(4, 1fr); }

@media (max-width: 640px) {
  .ds-grid-2,
  .ds-grid-3,
  .ds-grid-4 {
    grid-template-columns: 1fr;
  }
}

.ds-hairline {
  border: none;
  border-top: 0.5px solid var(--color-separator);
  margin: 0;
}
.ds-hairline-v {
  border: none;
  border-left: 0.5px solid var(--color-separator);
}

.ds-section-title {
  padding: 0 var(--space-lg);
  margin-bottom: var(--space-sm);
}

/* --------------------------------------------------------------------------
   5. Buttons
   -------------------------------------------------------------------------- */
.ds-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-xs);
  border: none;
  border-radius: var(--radius-button);
  font-family: var(--font-sans);
  font-weight: var(--font-weight-semibold);
  font-size: var(--font-size-callout);
  line-height: 1;
  padding: 12px 20px;
  cursor: pointer;
  user-select: none;
  transition: transform var(--duration-fast) var(--ease-standard),
    background-color var(--duration-fast) var(--ease-standard),
    opacity var(--duration-fast) var(--ease-standard),
    box-shadow var(--duration-fast) var(--ease-standard);
  -webkit-tap-highlight-color: transparent;
}
.ds-btn:focus-visible {
  outline: 2px solid var(--color-accent);
  outline-offset: 2px;
}
.ds-btn:active {
  transform: scale(0.97);
}
.ds-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  transform: none;
}

.ds-btn--primary {
  background: var(--color-accent);
  color: var(--color-label-on-accent);
  box-shadow: var(--shadow-xs);
}
.ds-btn--primary:hover:not(:disabled) {
  background: var(--color-accent-hover);
}
.ds-btn--primary:active:not(:disabled) {
  background: var(--color-accent-pressed);
}

.ds-btn--secondary {
  background: var(--color-fill);
  color: var(--color-accent);
}
.ds-btn--secondary:hover:not(:disabled) {
  background: var(--color-fill-strong);
}

.ds-btn--tertiary {
  background: transparent;
  color: var(--color-accent);
  padding-inline: 8px;
}
.ds-btn--tertiary:hover:not(:disabled) {
  background: var(--color-fill-secondary);
}

.ds-btn--destructive {
  background: var(--color-danger);
  color: #ffffff;
}
.ds-btn--destructive:hover:not(:disabled) {
  filter: brightness(1.06);
}

.ds-btn--sm {
  padding: 8px 14px;
  font-size: var(--font-size-footnote);
  border-radius: var(--radius-input);
}
.ds-btn--lg {
  padding: 16px 24px;
  font-size: var(--font-size-headline);
}
.ds-btn--full {
  width: 100%;
}
.ds-btn--icon {
  padding: 10px;
  border-radius: var(--radius-pill);
  width: 40px;
  height: 40px;
}

/* --------------------------------------------------------------------------
   6. Forms
   -------------------------------------------------------------------------- */
.ds-field {
  display: flex;
  flex-direction: column;
  gap: var(--space-xs);
}
.ds-label {
  font-size: var(--font-size-footnote);
  font-weight: var(--font-weight-medium);
  color: var(--color-label-secondary);
}

.ds-input,
.ds-textarea,
.ds-select {
  appearance: none;
  width: 100%;
  border: 0.5px solid var(--color-separator);
  background: var(--color-bg-primary);
  border-radius: var(--radius-input);
  padding: 12px 14px;
  font-size: var(--font-size-callout);
  color: var(--color-label-primary);
  transition: border-color var(--duration-fast) var(--ease-standard),
    box-shadow var(--duration-fast) var(--ease-standard);
}
.ds-input::placeholder,
.ds-textarea::placeholder {
  color: var(--color-label-tertiary);
}
.ds-input:hover,
.ds-textarea:hover,
.ds-select:hover {
  border-color: var(--color-label-tertiary);
}
.ds-input:focus-visible,
.ds-textarea:focus-visible,
.ds-select:focus-visible {
  outline: none;
  border-color: var(--color-accent);
  box-shadow: 0 0 0 4px var(--color-accent-tint);
}
.ds-input:disabled,
.ds-textarea:disabled {
  background: var(--color-fill-secondary);
  color: var(--color-label-tertiary);
  cursor: not-allowed;
}
.ds-input--error {
  border-color: var(--color-danger);
}
.ds-input--error:focus-visible {
  box-shadow: 0 0 0 4px var(--color-danger-tint);
}
.ds-field-hint {
  font-size: var(--font-size-caption1);
  color: var(--color-label-tertiary);
}
.ds-field-hint--error {
  color: var(--color-danger);
}
.ds-textarea {
  resize: vertical;
  min-height: 96px;
}

/* Toggle (iOSスイッチ) */
.ds-toggle {
  position: relative;
  display: inline-block;
  width: 51px;
  height: 31px;
  flex-shrink: 0;
}
.ds-toggle input {
  position: absolute;
  opacity: 0;
  width: 100%;
  height: 100%;
  margin: 0;
  cursor: pointer;
}
.ds-toggle-track {
  position: absolute;
  inset: 0;
  background: var(--color-fill-strong);
  border-radius: var(--radius-pill);
  transition: background var(--duration-base) var(--ease-standard);
}
.ds-toggle-thumb {
  position: absolute;
  top: 2px;
  left: 2px;
  width: 27px;
  height: 27px;
  border-radius: 50%;
  background: #ffffff;
  box-shadow: var(--shadow-sm);
  transition: transform var(--duration-base) var(--ease-emphasized);
}
.ds-toggle input:checked ~ .ds-toggle-track {
  background: var(--color-success);
}
.ds-toggle input:checked ~ .ds-toggle-thumb {
  transform: translateX(20px);
}
.ds-toggle input:focus-visible ~ .ds-toggle-track {
  outline: 2px solid var(--color-accent);
  outline-offset: 2px;
}
.ds-toggle input:disabled ~ .ds-toggle-track {
  opacity: 0.4;
}

/* Checkbox / Radio */
.ds-checkbox,
.ds-radio {
  width: 22px;
  height: 22px;
  border: 1.5px solid var(--color-label-tertiary);
  background: var(--color-bg-primary);
  cursor: pointer;
  position: relative;
  flex-shrink: 0;
  transition: background var(--duration-fast), border-color var(--duration-fast);
}
.ds-checkbox {
  border-radius: 7px;
}
.ds-radio {
  border-radius: 50%;
}
.ds-checkbox:checked,
.ds-radio:checked {
  background: var(--color-accent);
  border-color: var(--color-accent);
}
.ds-checkbox:focus-visible,
.ds-radio:focus-visible {
  outline: 2px solid var(--color-accent);
  outline-offset: 2px;
}

/* Segmented control */
.ds-segmented {
  display: inline-flex;
  padding: 2px;
  background: var(--color-fill);
  border-radius: var(--radius-input);
  gap: 2px;
}
.ds-segmented button {
  border: none;
  background: transparent;
  padding: 7px 16px;
  border-radius: calc(var(--radius-input) - 2px);
  font-size: var(--font-size-footnote);
  font-weight: var(--font-weight-medium);
  color: var(--color-label-secondary);
  cursor: pointer;
  transition: background var(--duration-fast), color var(--duration-fast), box-shadow var(--duration-fast);
}
.ds-segmented button.is-active {
  background: var(--color-bg-elevated);
  color: var(--color-label-primary);
  box-shadow: var(--shadow-xs);
}
.ds-segmented button:focus-visible {
  outline: 2px solid var(--color-accent);
  outline-offset: 1px;
}

/* Chip / Tag */
.ds-chip {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2xs);
  padding: 5px 12px;
  border-radius: var(--radius-pill);
  font-size: var(--font-size-caption1);
  font-weight: var(--font-weight-semibold);
  white-space: nowrap;
}
.ds-chip--wind {
  background: var(--color-wind-chip-bg);
  color: var(--color-wind-chip-fg);
}
.ds-chip--race {
  background: var(--color-race-tint);
  color: var(--color-race);
}
.ds-chip--practice {
  background: var(--color-practice-tint);
  color: var(--color-practice);
}
.ds-chip--neutral {
  background: var(--color-fill);
  color: var(--color-label-secondary);
}

/* --------------------------------------------------------------------------
   7. Cards
   -------------------------------------------------------------------------- */
.ds-card {
  background: var(--color-bg-elevated);
  border-radius: var(--radius-card);
  border: 0.5px solid var(--color-separator);
  box-shadow: var(--shadow-sm);
  padding: var(--space-lg);
  transition: transform var(--duration-fast) var(--ease-standard),
    box-shadow var(--duration-fast) var(--ease-standard);
}
.ds-card--interactive {
  cursor: pointer;
}
.ds-card--interactive:hover {
  box-shadow: var(--shadow-md);
  transform: translateY(-1px);
}
.ds-card--interactive:active {
  transform: translateY(0) scale(0.99);
}

.ds-card-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--space-md);
  margin-bottom: var(--space-md);
}

/* Grouped list（iOS設定風） */
.ds-list {
  background: var(--color-bg-elevated);
  border-radius: var(--radius-card);
  border: 0.5px solid var(--color-separator);
  overflow: hidden;
}
.ds-list-row {
  display: flex;
  align-items: center;
  gap: var(--space-md);
  padding: 14px var(--space-lg);
  min-height: 24px;
}
.ds-list-row + .ds-list-row {
  border-top: 0.5px solid var(--color-separator);
}
.ds-list-row--interactive {
  cursor: pointer;
  transition: background var(--duration-fast);
}
.ds-list-row--interactive:hover {
  background: var(--color-fill-secondary);
}

/* --------------------------------------------------------------------------
   8. Navigation — Top bar / Tab bar（iOS的マテリアル）
   -------------------------------------------------------------------------- */
.ds-topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-md);
  padding: 0 var(--space-lg);
  height: 56px;
  background: var(--material-bg);
  backdrop-filter: blur(var(--material-blur));
  -webkit-backdrop-filter: blur(var(--material-blur));
  border-bottom: 0.5px solid var(--material-border);
}
.ds-topbar-title {
  font-size: var(--font-size-headline);
  font-weight: var(--font-weight-semibold);
}

.ds-tabbar {
  position: sticky;
  bottom: 0;
  z-index: 40;
  display: flex;
  justify-content: space-around;
  align-items: stretch;
  padding-bottom: env(safe-area-inset-bottom, 0);
  background: var(--material-bg);
  backdrop-filter: blur(var(--material-blur));
  -webkit-backdrop-filter: blur(var(--material-blur));
  border-top: 0.5px solid var(--material-border);
}
.ds-tabbar-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  padding: 8px 4px 10px;
  background: transparent;
  border: none;
  color: var(--color-label-tertiary);
  cursor: pointer;
  font-size: var(--font-size-caption2);
  font-weight: var(--font-weight-medium);
  text-transform: none;
  letter-spacing: 0;
  transition: color var(--duration-fast);
}
.ds-tabbar-item svg {
  width: 24px;
  height: 24px;
}
.ds-tabbar-item.is-active {
  color: var(--color-accent);
}
.ds-tabbar-item:focus-visible {
  outline: 2px solid var(--color-accent);
  outline-offset: -2px;
  border-radius: var(--radius-sm);
}

/* --------------------------------------------------------------------------
   9. Dialog / Sheet
   -------------------------------------------------------------------------- */
.ds-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--space-lg);
}
.ds-dialog {
  width: 100%;
  max-width: 400px;
  background: var(--color-bg-elevated);
  border-radius: var(--radius-sheet);
  box-shadow: var(--shadow-lg);
  padding: var(--space-2xl) var(--space-xl);
  text-align: center;
}
.ds-dialog-title {
  font-size: var(--font-size-headline);
  font-weight: var(--font-weight-semibold);
  margin-bottom: var(--space-xs);
}
.ds-dialog-body {
  font-size: var(--font-size-footnote);
  color: var(--color-label-secondary);
  margin-bottom: var(--space-lg);
}
.ds-dialog-actions {
  display: flex;
  flex-direction: column;
  gap: var(--space-sm);
}
.ds-dialog-actions--row {
  flex-direction: row;
}
.ds-dialog-actions--row .ds-btn {
  flex: 1;
}

.ds-sheet {
  width: 100%;
  max-width: 480px;
  background: var(--color-bg-elevated);
  border-radius: var(--radius-sheet) var(--radius-sheet) 0 0;
  box-shadow: var(--shadow-lg);
  padding: var(--space-lg) var(--space-lg) var(--space-2xl);
  align-self: flex-end;
}
.ds-sheet-handle {
  width: 36px;
  height: 5px;
  border-radius: var(--radius-pill);
  background: var(--color-fill-strong);
  margin: 0 auto var(--space-lg);
}

/* --------------------------------------------------------------------------
   10. Table
   -------------------------------------------------------------------------- */
.ds-table {
  width: 100%;
  border-collapse: collapse;
  background: var(--color-bg-elevated);
  border-radius: var(--radius-card);
  overflow: hidden;
  border: 0.5px solid var(--color-separator);
}
.ds-table th,
.ds-table td {
  text-align: left;
  padding: 12px var(--space-lg);
  font-size: var(--font-size-footnote);
}
.ds-table thead th {
  background: var(--color-bg-secondary);
  color: var(--color-label-secondary);
  font-weight: var(--font-weight-semibold);
  font-size: var(--font-size-caption1);
  text-transform: uppercase;
  letter-spacing: 0.03em;
}
.ds-table tbody tr + tr td {
  border-top: 0.5px solid var(--color-separator);
}
.ds-table tbody tr {
  transition: background var(--duration-fast);
}
.ds-table tbody tr:hover {
  background: var(--color-fill-secondary);
}

/* --------------------------------------------------------------------------
   11. sailvlog固有コンポーネント
   -------------------------------------------------------------------------- */

/* セッションカード */
.ds-session-card {
  display: flex;
  flex-direction: column;
  gap: var(--space-sm);
  background: var(--color-bg-elevated);
  border: 0.5px solid var(--color-separator);
  border-radius: var(--radius-card);
  box-shadow: var(--shadow-sm);
  padding: var(--space-lg);
  cursor: pointer;
  transition: transform var(--duration-fast) var(--ease-standard), box-shadow var(--duration-fast);
}
.ds-session-card:hover {
  box-shadow: var(--shadow-md);
  transform: translateY(-1px);
}
.ds-session-card:active {
  transform: translateY(0) scale(0.99);
}
.ds-session-card-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-sm);
}
.ds-session-card-title {
  font-size: var(--font-size-headline);
  font-weight: var(--font-weight-semibold);
}
.ds-session-card-meta {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-sm);
  color: var(--color-label-secondary);
  font-size: var(--font-size-footnote);
}
.ds-session-card-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: var(--space-xs);
}

/* 再生コントロールバー */
.ds-playbar {
  display: flex;
  flex-direction: column;
  gap: var(--space-sm);
  background: var(--material-bg);
  backdrop-filter: blur(var(--material-blur));
  -webkit-backdrop-filter: blur(var(--material-blur));
  border: 0.5px solid var(--material-border);
  border-radius: var(--radius-card);
  box-shadow: var(--shadow-float);
  padding: var(--space-md) var(--space-lg);
}
.ds-playbar-row {
  display: flex;
  align-items: center;
  gap: var(--space-md);
}
.ds-playbar-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: none;
  background: var(--color-fill);
  color: var(--color-label-primary);
  cursor: pointer;
  transition: background var(--duration-fast), transform var(--duration-fast);
}
.ds-playbar-btn:hover {
  background: var(--color-fill-strong);
}
.ds-playbar-btn:active {
  transform: scale(0.94);
}
.ds-playbar-btn--play {
  width: 48px;
  height: 48px;
  background: var(--color-accent);
  color: #fff;
}
.ds-playbar-btn--play:hover {
  background: var(--color-accent-hover);
}
.ds-playbar-btn:focus-visible {
  outline: 2px solid var(--color-accent);
  outline-offset: 2px;
}
.ds-playbar-speed {
  font-size: var(--font-size-caption1);
  font-weight: var(--font-weight-semibold);
  color: var(--color-label-secondary);
  background: var(--color-fill);
  border: none;
  border-radius: var(--radius-pill);
  padding: 6px 12px;
  cursor: pointer;
}
.ds-playbar-speed:hover {
  background: var(--color-fill-strong);
}
.ds-playbar-time {
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  font-size: var(--font-size-caption1);
  color: var(--color-label-secondary);
  min-width: 42px;
}

/* タイムライン + 注釈ピン */
.ds-timeline {
  position: relative;
  height: 6px;
  border-radius: var(--radius-pill);
  background: var(--color-fill);
  cursor: pointer;
}
.ds-timeline-fill {
  position: absolute;
  inset: 0;
  right: auto;
  border-radius: var(--radius-pill);
  background: var(--color-accent);
}
.ds-timeline-scrubber {
  position: absolute;
  top: 50%;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #ffffff;
  border: 2px solid var(--color-accent);
  transform: translate(-50%, -50%);
  box-shadow: var(--shadow-sm);
}
.ds-timeline-pin {
  position: absolute;
  top: 50%;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  border: 2px solid var(--color-bg-elevated);
  cursor: pointer;
}
.ds-timeline-pin--mark {
  background: var(--color-warning);
}
.ds-timeline-pin--start {
  background: var(--color-success);
}
.ds-timeline-pin--tack {
  background: var(--color-accent);
}

/* レグジャンプチップ */
.ds-leg-jumps {
  display: flex;
  gap: var(--space-xs);
  overflow-x: auto;
  padding-bottom: 2px;
}
.ds-leg-jump {
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 6px 12px;
  border-radius: var(--radius-pill);
  background: var(--color-fill);
  color: var(--color-label-secondary);
  font-size: var(--font-size-caption1);
  font-weight: var(--font-weight-medium);
  border: none;
  cursor: pointer;
  white-space: nowrap;
  transition: background var(--duration-fast), color var(--duration-fast);
}
.ds-leg-jump.is-active {
  background: var(--color-accent);
  color: #ffffff;
}
.ds-leg-jump:hover:not(.is-active) {
  background: var(--color-fill-strong);
}

/* 2艇比較トグル */
.ds-boat-toggle {
  display: inline-flex;
  align-items: center;
  gap: var(--space-sm);
  padding: 6px 10px;
  border-radius: var(--radius-pill);
  background: var(--color-fill);
  border: none;
  cursor: pointer;
  font-size: var(--font-size-caption1);
  font-weight: var(--font-weight-semibold);
  color: var(--color-label-secondary);
  transition: background var(--duration-fast), color var(--duration-fast);
}
.ds-boat-toggle.is-active {
  background: var(--color-accent-tint);
  color: var(--color-accent);
}
.ds-boat-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}

/* 艇カラーレジェンド */
.ds-boat-legend {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-md);
}
.ds-boat-legend-item {
  display: flex;
  align-items: center;
  gap: var(--space-xs);
  font-size: var(--font-size-footnote);
  color: var(--color-label-secondary);
}

/* --------------------------------------------------------------------------
   12b. Nautical / Water — 海図と水面の視覚言語
   柱1: 海図（グリッド・等深線・コンパスローズ）を構造の語彙に。
   柱2: 水面と光（ヒーロー帯・リプレイ海面の深いグラデーション）を雰囲気の語彙に。
   どちらも装飾ではなく「読む」体験（進路・時刻・区画）を支えるために使う。
   -------------------------------------------------------------------------- */

/* ヒーロー帯: セッション一覧・アップロードの見出し部に使う「海」バンド。
   テーマに関わらず常に深い水の表現を使う（--gradient-water-* はテーマ非依存）。 */
.ds-hero-water {
  position: relative;
  overflow: hidden;
  background-image: var(--gradient-water-dawn);
  color: var(--color-hero-label-primary);
  padding: var(--space-2xl) var(--space-lg);
}
.ds-hero-water--deep { background-image: var(--gradient-water-deep); }
.ds-hero-water .ds-text-title1,
.ds-hero-water .ds-text-headline { color: var(--color-hero-label-primary); }
.ds-hero-water-sub { color: var(--color-hero-label-secondary); font-size: var(--font-size-footnote); margin-top: var(--space-xs); }

/* 海図グリッド + 等深線オーバーレイ（疑似要素・pointer-events無効・装飾専用） */
.ds-hero-water::before,
.ds-chart-surface::before {
  content: "";
  position: absolute;
  inset: -20% -20%;
  background-image:
    repeating-linear-gradient(0deg, var(--color-chart-grid-on-water) 0 1px, transparent 1px 56px),
    repeating-linear-gradient(90deg, var(--color-chart-grid-on-water) 0 1px, transparent 1px 56px),
    repeating-radial-gradient(ellipse at 28% 72%, transparent 0 78px, var(--color-chart-line-on-water) 79px 80px, transparent 81px 160px);
  animation: ds-chart-drift 90s linear infinite;
  pointer-events: none;
}
.ds-hero-water > * { position: relative; z-index: 1; }

/* 汎用「海図面」ユーティリティ: リプレイCanvasの下敷きなど、常時ダークな面に使う */
.ds-chart-surface {
  position: relative;
  overflow: hidden;
  background-image: var(--gradient-water-deep);
}
.ds-chart-surface > * { position: relative; z-index: 1; }

@keyframes ds-chart-drift {
  from { transform: translate(0, 0); }
  to { transform: translate(-56px, -56px); }
}
@media (prefers-reduced-motion: reduce) {
  .ds-hero-water::before,
  .ds-chart-surface::before {
    animation: none;
  }
}

/* コンパスローズ（装飾・空状態やヒーロー帯の隅に置く低不透明度の飾り。乱用しない=1画面1箇所まで） */
.ds-compass-rose {
  color: var(--color-compass-ink);
  opacity: 0.5;
}
.ds-hero-water .ds-compass-rose,
.ds-chart-surface .ds-compass-rose {
  color: var(--color-chart-line-on-water);
  opacity: 0.7;
}

/* 風向・風速チップのアイコン枠（風羽根/矢羽のインラインSVG用） */
.ds-chip--wind svg {
  width: 12px;
  height: 12px;
  flex-shrink: 0;
}

/* 緯度経度座標風のラベル（Canvas縁・スケールバー等に添える固有語彙） */
.ds-chart-coord {
  font-family: var(--font-mono);
  font-size: var(--font-size-caption2);
  letter-spacing: 0.02em;
}

/* --------------------------------------------------------------------------
   13. アクセシビリティユーティリティ
   -------------------------------------------------------------------------- */
.ds-visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

*:focus-visible {
  outline: 2px solid var(--color-accent);
  outline-offset: 2px;
}


/* ============================================================
   upload.html 固有スタイル（すべて上記トークンから派生。生hex/px追加なし）
   ============================================================ */
body { padding-bottom: var(--space-6xl); }

.wizard-steps {
  display: flex; gap: var(--space-sm); margin-bottom: var(--space-2xl); flex-wrap: wrap;
}
.wizard-step {
  display: flex; align-items: center; gap: var(--space-xs);
  font-size: var(--font-size-footnote); font-weight: var(--font-weight-medium);

}
.wizard-step-num {

  color: var(--color-label-secondary);
}
.wizard-step.is-done .wizard-step-num { background: var(--color-success); color: #fff; }
.wizard-step.is-current { color: var(--color-label-primary); }

.section-card { margin-bottom: var(--space-xl); }
.section-title { display: flex; align-items: center; gap: var(--space-sm); margin-bottom: var(--space-lg); }

}

.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-lg); }
@media (max-width: 640px) { .form-grid { grid-template-columns: 1fr; } }

.radio-group { display: flex; gap: var(--space-lg); }
.radio-option { display: flex; align-items: center; gap: var(--space-xs); cursor: pointer; font-size: var(--font-size-callout); }

.dropzone {
  border: 1.5px dashed var(--color-separator-opaque);
  border-radius: var(--radius-card);
  padding: var(--space-3xl) var(--space-lg);
  text-align: center;

}
.dropzone:hover, .dropzone.is-dragover { border-color: var(--color-accent); background: var(--color-accent-tint); }

/* タッチ環境ではDnDを想定せず「ファイルを選択」ボタンのみを主動線にする */
.dropzone-dnd-hint { display: block; }
@media (pointer: coarse) {
  .dropzone-dnd-hint { display: none; }
}

.file-row {
  display: flex; align-items: center; gap: var(--space-md);
  padding: var(--space-md); border-radius: var(--radius-input); background: var(--color-bg-secondary);
}
.file-row + .file-row { margin-top: var(--space-sm); }
.file-status-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.file-status-dot.ok { background: var(--color-success); }
.file-status-dot.error { background: var(--color-danger); }
.file-name { font-family: var(--font-mono); font-size: var(--font-size-caption1); color: var(--color-label-tertiary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px; }
.file-row-label-input { flex: 1; min-width: 120px; }
.file-error-text { color: var(--color-danger); font-size: var(--font-size-footnote); flex: 1; }

.preview-wrap { position: relative; height: 260px; border-radius: var(--radius-card); overflow: hidden; background: var(--color-bg-canvas); border: 0.5px solid var(--color-separator); }
#previewCanvas { display: block; width: 100%; height: 100%; }
.preview-empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--color-label-tertiary); font-size: var(--font-size-footnote); text-align: center; padding: var(--space-lg); }

.wizard-actions { display: flex; justify-content: flex-end; gap: var(--space-sm); margin-top: var(--space-2xl); }

.toast {
  position: fixed; bottom: var(--space-2xl); left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--color-bg-elevated); border: 0.5px solid var(--color-separator-opaque); color: var(--color-label-primary);
  padding: var(--space-md) var(--space-xl); border-radius: var(--radius-input); font-size: var(--font-size-footnote);
  box-shadow: var(--shadow-lg); opacity: 0; pointer-events: none; transition: all var(--duration-slow) var(--ease-emphasized); z-index: 50;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="ds-topbar">
  <div class="ds-row ds-gap-sm">
    <span style="width:8px;height:8px;border-radius:50%;background:var(--color-accent);display:inline-block;"></span>
    <span class="ds-topbar-title">sailvlog</span>
  </div>
  <button class="ds-btn ds-btn--secondary ds-btn--sm" onclick="dsToggleTheme()" id="themeToggleBtn">Auto</button>
</div>

<div class="ds-hero-water">
  <div class="ds-compass-rose" style="position:absolute; top: var(--space-lg); right: var(--space-lg); width:48px; height:48px;" aria-hidden="true">
    <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/>
      <polygon points="12 6 13.6 11 12 12 10.4 11" fill="currentColor" stroke="none"/>
      <polygon points="12 18 10.4 13 12 12 13.6 13" fill="currentColor" stroke="none" opacity="0.5"/>
    </svg>
  </div>
  <div class="ds-container" style="max-width: 720px;">
    <div class="ds-text-title1">セッションを登録</div>
    <div class="ds-hero-water-sub">GPXファイルを取り込んで、複数艇のリプレイセッションを作成します。</div>
  </div>
</div>

<main class="ds-container" style="padding-top: var(--space-2xl); max-width: 720px;">
  <div class="wizard-steps">
    <div class="wizard-step is-current" data-step-indicator="1"><span class="wizard-step-num">1</span>基本情報</div>
    <div class="wizard-step" data-step-indicator="2"><span class="wizard-step-num">2</span>GPX取込</div>
    <div class="wizard-step" data-step-indicator="3"><span class="wizard-step-num">3</span>保存</div>
  </div>

  <!-- エラー帯（サーバ再検証失敗時。デフォルト非表示） -->
  <div id="formError" style="display:none; background: var(--color-danger-tint); border: 0.5px solid var(--color-danger); border-radius: var(--radius-input); padding: var(--space-md) var(--space-lg); margin-bottom: var(--space-lg);">
    <span class="ds-text-footnote" style="color: var(--color-danger);">保存に失敗しました。ファイルサイズまたは形式をご確認のうえ再度お試しください。</span>
  </div>

  <!-- ===== Step 1: 基本情報 ===== -->
  <section class="ds-card section-card">
    <div class="section-title">
      <span class="section-title-num">1</span>
      <span class="ds-text-headline">基本情報</span>
    </div>
    <div class="ds-stack ds-gap-lg">
      <div class="ds-field">
        <label class="ds-label">タイトル</label>
        <input type="text" class="ds-input" id="titleInput" placeholder="例: 江の島 定期練習" value="江の島 定期練習">
      </div>
      <div class="form-grid">
        <div class="ds-field">
          <label class="ds-label">種別</label>
          <div class="radio-group" style="padding-top: var(--space-xs);">
            <label class="radio-option"><input type="radio" class="ds-radio" name="sessionType" value="practice" checked> 練習</label>
            <label class="radio-option"><input type="radio" class="ds-radio" name="sessionType" value="race"> レース</label>
          </div>
        </div>
        <div class="ds-field">
          <label class="ds-label">日時</label>
          <input type="datetime-local" class="ds-input" id="dateInput" value="2026-07-20T15:00">
        </div>
      </div>
      <div class="form-grid">
        <div class="ds-field">
          <label class="ds-label">会場</label>
          <input type="text" class="ds-input" placeholder="例: 江の島" value="江の島">
        </div>
        <div class="ds-field">
          <label class="ds-label">風況メモ</label>
          <input type="text" class="ds-input" placeholder="例: 南西8-12kt、うねりあり" value="南西8-12kt、うねりあり">
        </div>
      </div>
    </div>
  </section>

  <!-- ===== Step 2: GPX取込 ===== -->
  <section class="ds-card section-card">
    <div class="section-title">
      <span class="section-title-num">2</span>
      <span class="ds-text-headline">GPXファイル（複数選択可・艇ごとにラベル付け）</span>
    </div>

    <div class="dropzone" id="dropzone">
      <div class="dropzone-icon">📂</div>
      <div class="ds-text-body"><span class="dropzone-dnd-hint">ここにGPXをドラッグ&ドロップ、または </span><span class="ds-text-accent" style="font-weight: var(--font-weight-semibold);">ファイルを選択</span></div>
      <div class="ds-text-caption1" style="margin-top: var(--space-xs);">.gpx形式・複数選択可</div>
      <input type="file" id="fileInput" accept=".gpx" multiple style="display:none;">
    </div>

    <div class="ds-stack ds-gap-sm" id="fileList" style="margin-top: var(--space-lg);"></div>

    <div class="ds-text-caption2" style="margin: var(--space-2xl) 0 var(--space-md);">プレビュー（全艇の航跡を重ね描き・時刻同期確認用）</div>
    <div class="preview-wrap" id="previewWrap">
      <canvas id="previewCanvas"></canvas>
      <div class="preview-empty" id="previewEmpty">GPXファイルを取り込むと、ここに航跡プレビューが表示されます</div>
    </div>
  </section>

  <div class="wizard-actions">
    <button class="ds-btn ds-btn--secondary" id="backToListBtn">一覧に戻る</button>
    <button class="ds-btn ds-btn--primary" id="saveBtn" disabled>保存してリプレイを開く</button>
  </div>
</main>

<div class="toast" id="toast">保存しました。リプレイへ移動します…</div>

<script>
(function () {
  "use strict";

  /* ---- サンプル艇データ（取り込み済みファイルのモック） ---- */
  const sampleFiles = [
    { name: "4423_track.gpx", boatLabel: "4423 田中/佐藤", status: "ok", seed: 11 },
    { name: "manebtt.gpx", boatLabel: "マネ艇", status: "ok", seed: 23 },
    { name: "1102_track.gpx", boatLabel: "1102 鈴木/高橋", status: "ok", seed: 37 },
  ];
  let files = [];

  const fileListEl = document.getElementById("fileList");
  const dropzone = document.getElementById("dropzone");
  const fileInput = document.getElementById("fileInput");
  const saveBtn = document.getElementById("saveBtn");
  const previewEmpty = document.getElementById("previewEmpty");
  const canvas = document.getElementById("previewCanvas");
  const ctx = canvas.getContext("2d");
  const wrap = document.getElementById("previewWrap");

  const boatColorVars = ["--color-boat-1", "--color-boat-2", "--color-boat-3", "--color-boat-4"];
  function getVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

  function seededRandom(seed) {
    let s = seed;
    return function () { s = (s * 9301 + 49297) % 233280; return s / 233280; };
  }
  function buildPath(seed, originX, originY, dirSign) {
    const rnd = seededRandom(seed);
    const pts = [];
    let x = originX, y = originY;
    for (let i = 0; i < 6; i++) {
      const angle = (dirSign * (i % 2 === 0 ? 1 : -1)) * (0.35 + rnd() * 0.15);
      for (let s = 0; s < 26; s++) {
        x += Math.sin(angle) * (620 / 26) + (rnd() - 0.5) * 3;
        y += -Math.cos(angle) * (620 / 26) * 0.7 + (rnd() - 0.5) * 3;
        pts.push({ x, y });
      }
    }
    return pts;
  }

  function project(pt, rect) {
    const scale = Math.min(rect.width / 1500, rect.height / 900);
    const offX = (rect.width - 1500 * scale) / 2;
    const offY = (rect.height - 900 * scale) / 2;
    return { x: pt.x * scale + offX, y: pt.y * scale + offY };
  }

  function resizeCanvas() {
    const rect = wrap.getBoundingClientRect();
    canvas.width = rect.width * devicePixelRatio;
    canvas.height = rect.height * devicePixelRatio;
    canvas.style.width = rect.width + "px";
    canvas.style.height = rect.height + "px";
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  }

  function drawPreview() {
    const rect = wrap.getBoundingClientRect();
    ctx.clearRect(0, 0, rect.width, rect.height);
    const okFiles = files.filter((f) => f.status === "ok");
    okFiles.forEach((f, i) => {
      const color = getVar(boatColorVars[i % boatColorVars.length]);
      const path = buildPath(f.seed, 500 + i * 100, 700 + i * 20, i % 2 === 0 ? 1 : -1);
      ctx.beginPath();
      ctx.strokeStyle = color;
      ctx.globalAlpha = 0.75;
      ctx.lineWidth = 1.6;
      path.forEach((pt, j) => {
        const p = project(pt, rect);
        if (j === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
      });
      ctx.stroke();
      ctx.globalAlpha = 1;
    });
  }

  function renderFileList() {
    fileListEl.innerHTML = "";
    files.forEach((f, idx) => {
      const row = document.createElement("div");
      row.className = "file-row";
      if (f.status === "ok") {
        row.innerHTML = `
          <span class="file-status-dot ok"></span>
          <span class="file-name">${f.name}</span>
          <span class="ds-text-caption1">→ 艇名</span>
          <input type="text" class="ds-input file-row-label-input" value="${f.boatLabel}" data-idx="${idx}">
          <span class="ds-chip ds-chip--neutral" style="background: var(--color-success-tint); color: var(--color-success);">✓ 解析OK</span>
          <button class="ds-btn ds-btn--tertiary ds-btn--sm" data-remove="${idx}">削除</button>
        `;
      } else {
        row.innerHTML = `
          <span class="file-status-dot error"></span>
          <span class="file-name">${f.name}</span>
          <span class="file-error-text">解析エラー: GPX形式が不正です</span>
          <button class="ds-btn ds-btn--tertiary ds-btn--sm" data-remove="${idx}">削除</button>
        `;
      }
      fileListEl.appendChild(row);
    });

    fileListEl.querySelectorAll("[data-remove]").forEach((btn) => {
      btn.addEventListener("click", () => {
        files.splice(parseInt(btn.dataset.remove, 10), 1);
        renderFileList();
        drawPreview();
        updateSaveState();
      });
    });
    fileListEl.querySelectorAll(".file-row-label-input").forEach((input) => {
      input.addEventListener("input", (e) => {
        files[parseInt(e.target.dataset.idx, 10)].boatLabel = e.target.value;
      });
    });
  }

  function updateSaveState() {
    const hasOkFile = files.some((f) => f.status === "ok");
    saveBtn.disabled = !hasOkFile;
  }

  function addFiles(newFiles) {
    files = files.concat(newFiles);
    previewEmpty.style.display = files.length ? "none" : "flex";
    renderFileList();
    drawPreview();
    updateSaveState();
  }

  /* ---- ドロップゾーン操作 ---- */
  dropzone.addEventListener("click", () => fileInput.click());
  dropzone.addEventListener("dragover", (e) => { e.preventDefault(); dropzone.classList.add("is-dragover"); });
  dropzone.addEventListener("dragleave", () => dropzone.classList.remove("is-dragover"));
  dropzone.addEventListener("drop", (e) => {
    e.preventDefault();
    dropzone.classList.remove("is-dragover");
    // モックアップ: 実ファイル内容は解析せずサンプルデータで取込を模擬
    simulateImport();
  });
  fileInput.addEventListener("change", () => {
    if (fileInput.files.length) simulateImport();
  });

  let importBatch = 0;
  function simulateImport() {
    // 1回目=正常6艇のうち未取込分、2回目以降は壊れたファイル1件を混ぜてエラー状態も確認できるようにする
    if (importBatch === 0) {
      addFiles(sampleFiles.map((f) => ({ ...f })));
    } else {
      addFiles([{ name: "corrupt.gpx", boatLabel: "", status: "error", seed: 0 }]);
    }
    importBatch++;
  }

  /* ---- 保存 ---- */
  const toast = document.getElementById("toast");
  saveBtn.addEventListener("click", () => {
    if (saveBtn.disabled) return;
    toast.classList.add("show");
    setTimeout(() => {
      window.location.href = "replay.html";
    }, 900);
  });

  document.getElementById("backToListBtn").addEventListener("click", () => {
    window.location.href = "sessions-list.html";
  });

  window.addEventListener("resize", () => { resizeCanvas(); drawPreview(); });
  resizeCanvas();
})();

/* テーマ切替（DS慣習） */
function dsApplyThemeLabel(){
  var t = document.documentElement.getAttribute('data-theme');
  var btn = document.getElementById('themeToggleBtn');
  if(!btn) return;
  btn.textContent = t === 'dark' ? 'Dark' : t === 'light' ? 'Light' : 'Auto';
}
function dsToggleTheme(){
  var root = document.documentElement;
  var t = root.getAttribute('data-theme');
  if (t === 'dark') { root.setAttribute('data-theme','light'); }
  else if (t === 'light') { root.removeAttribute('data-theme'); }
  else { root.setAttribute('data-theme','dark'); }
  dsApplyThemeLabel();
}
dsApplyThemeLabel();
</script>
