<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head><body>
<style>
.post-card { background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1.4rem 1.65rem;display:grid;grid-template-columns:48px 1fr;gap:1rem; }
.av { width:48px;height:48px;border-radius:50%;background:var(--card-warm);display:flex;align-items:center;justify-content:center;font-family:var(--font-body);font-weight:600;font-size:.95rem;color:var(--fg);border:1px solid var(--border); }
.h { display:flex;align-items:baseline;gap:.5rem;margin-bottom:.4rem; }
.author { font-weight:600;font-size:.98rem;color:var(--fg); }
.handle { font-family:var(--font-body);font-size:.85rem;color:var(--fg-mute); }
.time { font-family:var(--font-body);font-size:.82rem;color:var(--fg-dim);margin-left:auto; }
.body { color:var(--fg-2);font-size:1rem;line-height:1.65;margin-bottom:.75rem; }
.actions { display:flex;gap:1.5rem;font-family:var(--font-body);font-size:.86rem;color:var(--fg-mute); }
</style>
<div class="card flush">
  <article class="post-card">
    <div class="av">HT</div>
    <div>
      <div class="h"><span class="author">Hiro Tanaka</span><span class="handle">@hiro_470</span><span class="time">12 m</span></div>
      <div class="body">Enoshima, 14 kt S, flat. Just put new lowers on the 470 and the mast is finally tracking straight. Took six rigs to figure this out.</div>
      <div class="actions"><span>♥ 28</span><span>↻ 4</span><span>◌ 6</span></div>
    </div>
  </article>
</div></body></html>
