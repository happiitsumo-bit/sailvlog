<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head><body>
<style>
.boat-badge { display:inline-flex;align-items:center;font-family:var(--font-body);font-size:.78rem;font-weight:600;padding:.2rem .65rem;border-radius:999px;border:1px solid;background:var(--card-warm); }
.bb-flare { color:var(--terra); border-color:var(--border-flare); }
.bb-cyan { color:var(--sage); border-color:var(--border-cyan); }
.bb-lime { color:var(--dijon); border-color:rgba(195,154,63,.4); }
.tag { font-family:var(--font-body);font-size:.82rem;color:var(--fg-mute);padding:.2rem .7rem;border-radius:999px;border:1px solid var(--border); }
.tag::before { content:"#"; opacity:.5; margin-right:1px; }
.accepted-pill { display:inline-flex;align-items:center;gap:.35rem;background:rgba(107,142,90,.12);color:var(--sage-2);border:1px solid rgba(107,142,90,.3);font-family:var(--font-body);font-size:.74rem;padding:.15rem .6rem;border-radius:999px;font-weight:600; }
.accepted-pill::before { content:"✓"; }
.chip { font-family:var(--font-body);font-size:.85rem;font-weight:500;color:var(--fg-2);padding:.35rem .85rem;border:1px solid transparent;border-radius:999px;background:transparent; }
.chip.active { background:var(--fg);color:var(--paper);border-color:var(--fg); }
</style>
<div class="card">
  <div class="label">badges · tags · pills · chips</div>
  <div class="row"><span class="boat-badge bb-flare">470</span><span class="boat-badge bb-cyan">ILCA</span><span class="boat-badge bb-lime">Cruiser</span><span class="accepted-pill">Solved</span></div>
  <div class="row"><span class="tag">rigging</span><span class="tag">heavy-weather</span><span class="tag">tactics</span><span class="tag">wind-reading</span></div>
  <div class="row" style="background:var(--card);border:1px solid var(--border);border-radius:999px;padding:.5rem .65rem;gap:.4rem;"><span class="chip active">All</span><span class="chip">Unanswered</span><span class="chip">Solved</span><span class="chip">Top voted</span></div>
</div></body></html>
