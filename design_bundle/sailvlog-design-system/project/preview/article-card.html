<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head><body>
<style>
.article-card { background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1.5rem 1.75rem 1.25rem; }
.boat-badge { display:inline-flex;align-items:center;color:var(--terra);font-family:var(--font-body);font-size:.78rem;font-weight:600;padding:.2rem .65rem;border-radius:999px;border:1px solid var(--border-flare);background:var(--card-warm); }
.article-date { color:var(--fg-mute);font-size:.85rem;font-family:var(--font-mono); }
.article-title { font-family:var(--font-display);font-size:1.45rem;font-weight:500;line-height:1.3;color:var(--fg);letter-spacing:-.01em;margin:.85rem 0 1rem; }
.tag { font-family:var(--font-body);font-size:.82rem;color:var(--fg-mute);padding:.2rem .7rem;border-radius:999px;border:1px solid var(--border); }
.tag::before { content:"#";opacity:.5;margin-right:1px; }
.footer { display:flex;justify-content:space-between;align-items:center;padding-top:1rem;border-top:1px solid var(--border);margin-top:1rem; }
.author { display:flex;align-items:center;gap:.55rem;color:var(--fg-2);font-size:.92rem;font-weight:500; }
.avatar { width:26px;height:26px;border-radius:50%;background:var(--card-warm);display:inline-flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:600;color:var(--fg);border:1px solid var(--border); }
.stats { display:flex;gap:1rem;color:var(--fg-mute);font-size:.85rem;font-family:var(--font-body); }
</style>
<div class="card flush">
  <div class="article-card">
    <div style="display:flex;align-items:center;gap:.75rem;"><span class="boat-badge">470</span><span class="article-date">May 12, 2026</span></div>
    <h2 class="article-title">Tuning the 470 for medium air — a shroud tension log from Enoshima</h2>
    <div style="display:flex;gap:.4rem;flex-wrap:wrap;"><span class="tag">rigging</span><span class="tag">shrouds</span><span class="tag">tactics</span></div>
    <div class="footer">
      <div class="author"><span class="avatar">HT</span>Hiro Tanaka</div>
      <div class="stats"><span>284 views</span><span>24 likes</span><span>3 replies</span></div>
    </div>
  </div>
</div></body></html>
