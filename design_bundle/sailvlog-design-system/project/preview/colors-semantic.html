<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head><body>
<div class="card">
  <div class="label">foreground · ink scale</div>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;">
    <div class="swatch"><div class="swatch-chip" style="background:#1F1E1B;"></div><div class="swatch-name">--fg</div><div class="swatch-hex">#1F1E1B · text</div></div>
    <div class="swatch"><div class="swatch-chip" style="background:#3D3A33;"></div><div class="swatch-name">--fg-2</div><div class="swatch-hex">#3D3A33 · body</div></div>
    <div class="swatch"><div class="swatch-chip" style="background:#6B6760;"></div><div class="swatch-name">--fg-mute</div><div class="swatch-hex">#6B6760 · meta</div></div>
    <div class="swatch"><div class="swatch-chip" style="background:#9A968C;"></div><div class="swatch-name">--fg-dim</div><div class="swatch-hex">#9A968C · scaffold</div></div>
  </div>
  <div style="display:flex;gap:10px;align-items:center;">
    <span style="font-family:var(--font-mono);font-size:.7rem;color:var(--fg-mute);">borders →</span>
    <span style="padding:.3rem .65rem;border:1px solid rgba(31,30,27,.10);border-radius:6px;font-family:var(--font-mono);font-size:.7rem;color:var(--fg-2);background:var(--card);">--border 10%</span>
    <span style="padding:.3rem .65rem;border:1px solid rgba(31,30,27,.18);border-radius:6px;font-family:var(--font-mono);font-size:.7rem;color:var(--fg-2);background:var(--card);">--border-strong 18%</span>
  </div>
</div></body></html>
